<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Lab VIP Pro Max - 2 Tay + Khung Tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    #webcam {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 240px;
      height: 180px;
      border: 2px solid #00f0ff;
      border-radius: 14px;
      transform: scaleX(-1);
      z-index: 100;
      background: #050510;
      object-fit: cover;
      box-shadow: 0 0 25px #00f0ff55;
    }
    #status {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 12, 25, 0.9);
      border: 1px solid #00f0ff66;
      padding: 11px 28px;
      border-radius: 40px;
      font-size: 15px;
      color: #00f0ff;
      z-index: 100;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px #00f0ff33;
    }
    .hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 10, 22, 0.92);
      border: 1px solid #00f0ff44;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.7;
      color: #8af4ff;
      z-index: 100;
      max-width: 310px;
      backdrop-filter: blur(12px);
    }
    .hint b { color: #00f0ff; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="status">Đang khởi động Hệ thống Lab VIP Pro Max...</div>

  <div class="hint">
    <b>PHÒNG THÍ NGHIỆM HOLOGRAPHIC - VIP PRO MAX</b><br><br>
    <b>Tay Trái (xanh):</b> Chụm ngón → Kéo & Di chuyển vật thể<br>
    <b>Tay Phải (hồng):</b> Chụm ngón → Phóng to / Thu nhỏ<br>
    <b>Cả 2 tay mở:</b> Kích hoạt Energy Field mạnh<br>
    <b>Khung tay:</b> Hiển thị xương tay phát sáng realtime
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ====================== SCENE ======================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040a);
    scene.fog = new THREE.FogExp2(0x02040a, 0.022);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.8, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x0a1525, 0.7));
    const light1 = new THREE.PointLight(0x00f0ff, 3.5, 25);
    light1.position.set(4, 5, 3);
    scene.add(light1);
    const light2 = new THREE.PointLight(0xff0088, 2.2, 20);
    light2.position.set(-4, 3, -2);
    scene.add(light2);
    const light3 = new THREE.PointLight(0x00ffaa, 1.5, 18);
    light3.position.set(0, -1, 4);
    scene.add(light3);

    // Floor
    const grid = new THREE.GridHelper(24, 48, 0x00f0ff, 0x003344);
    grid.position.y = -1.8;
    scene.add(grid);

    // ====================== HOLO OBJECTS ======================
    const objects = [];
    function createHolo(type, x, y, z, color) {
      let geo;
      if (type === 'sphere') geo = new THREE.SphereGeometry(0.48, 48, 48);
      else if (type === 'box') geo = new THREE.BoxGeometry(0.75, 0.75, 0.75);
      else geo = new THREE.OctahedronGeometry(0.55);

      const mat = new THREE.MeshPhysicalMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.55,
        metalness: 0.25,
        roughness: 0.12,
        transparent: true,
        opacity: 0.88,
        transmission: 0.35,
        thickness: 0.6
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.userData = { grabbed: false, baseScale: 1 };
      scene.add(mesh);
      objects.push(mesh);

      // Outer glow
      const glowMat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.15,
        side: THREE.BackSide
      });
      const glow = new THREE.Mesh(geo.clone().scale(1.35, 1.35, 1.35), glowMat);
      mesh.add(glow);

      return mesh;
    }

    createHolo('sphere', -2.4, 0.9, 0.2, 0x00f0ff);
    createHolo('box', 0.1, 1.4, -1.1, 0xff0088);
    createHolo('octa', 2.5, 0.7, 0.6, 0x00ff99);
    createHolo('sphere', -1.2, -0.4, 1.7, 0xffaa00);
    createHolo('box', 1.7, -0.3, -1.6, 0xaa00ff);

    // ====================== HAND SKELETON ======================
    // MediaPipe Hand connections
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],          // thumb
      [0,5],[5,6],[6,7],[7,8],          // index
      [0,9],[9,10],[10,11],[11,12],     // middle
      [0,13],[13,14],[14,15],[15,16],   // ring
      [0,17],[17,18],[18,19],[19,20],   // pinky
      [5,9],[9,13],[13,17]              // palm
    ];

    function createHandSkeleton(color) {
      const group = new THREE.Group();
      const joints = [];
      const lines = [];

      // 21 joints
      for (let i = 0; i < 21; i++) {
        const joint = new THREE.Mesh(
          new THREE.SphereGeometry(0.045, 12, 12),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
        );
        group.add(joint);
        joints.push(joint);
      }

      // Connections
      HAND_CONNECTIONS.forEach(([a, b]) => {
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(), new THREE.Vector3()
        ]);
        const line = new THREE.Line(
          geo,
          new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75, linewidth: 2 })
        );
        group.add(line);
        lines.push({ line, a, b });
      });

      group.visible = false;
      scene.add(group);
      return { group, joints, lines };
    }

    const leftSkeleton = createHandSkeleton(0x00f0ff);   // xanh
    const rightSkeleton = createHandSkeleton(0xff0088);  // hồng

    // ====================== PARTICLES ======================
    const pCount = 600;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i++) pPos[i] = (Math.random() - 0.5) * 20;
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 0.035,
      transparent: true,
      opacity: 0.45,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // ====================== HAND TRACKING ======================
    const video = document.getElementById('webcam');
    const statusEl = document.getElementById('status');

    let leftHandData = null, rightHandData = null;
    let grabbedObject = null;

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    const cam = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });

    cam.start()
      .then(() => statusEl.textContent = "Hệ thống sẵn sàng — Đưa cả 2 tay vào khung hình")
      .catch(() => {
        statusEl.innerHTML = `<span style="color:#ff5555">Lỗi Camera!</span> Hãy chạy bằng Live Server hoặc python -m http.server`;
      });

    function updateSkeleton(skeleton, landmarks) {
      if (!landmarks) {
        skeleton.group.visible = false;
        return;
      }
      skeleton.group.visible = true;

      // Update joints
      landmarks.forEach((lm, i) => {
        const x = (0.5 - lm.x) * 9;
        const y = (0.5 - lm.y) * 6 + 0.3;
        const z = -lm.z * 5;
        skeleton.joints[i].position.set(x, y, z);
      });

      // Update lines
      skeleton.lines.forEach(({ line, a, b }) => {
        const positions = line.geometry.attributes.position;
        positions.setXYZ(0, skeleton.joints[a].position.x, skeleton.joints[a].position.y, skeleton.joints[a].position.z);
        positions.setXYZ(1, skeleton.joints[b].position.x, skeleton.joints[b].position.y, skeleton.joints[b].position.z);
        positions.needsUpdate = true;
      });
    }

    function onResults(results) {
      leftHandData = null;
      rightHandData = null;
      leftSkeleton.group.visible = false;
      rightSkeleton.group.visible = false;

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Không thấy tay — Đưa cả 2 tay vào khung";
        return;
      }

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const label = results.multiHandedness[i].label; // "Left" / "Right"
        const isLeft = label === "Left"; // vì video lật gương

        const index = landmarks[8];
        const thumb = landmarks[4];
        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const pinching = dist < 0.055;

        const x = (0.5 - index.x) * 9;
        const y = (0.5 - index.y) * 6 + 0.3;
        const z = -index.z * 5;

        if (isLeft) {
          leftHandData = { x, y, z, pinch: pinching };
          updateSkeleton(leftSkeleton, landmarks);
        } else {
          rightHandData = { x, y, z, pinch: pinching };
          updateSkeleton(rightSkeleton, landmarks);
        }
      }

      // === TƯƠNG TÁC ===
      // Tay trái: Grab
      if (leftHandData && leftHandData.pinch) {
        if (!grabbedObject) {
          let minD = 1.4;
          objects.forEach(obj => {
            const d = obj.position.distanceTo(new THREE.Vector3(leftHandData.x, leftHandData.y, leftHandData.z));
            if (d < minD) {
              minD = d;
              grabbedObject = obj;
            }
          });
        }
        if (grabbedObject) {
          grabbedObject.position.lerp(new THREE.Vector3(leftHandData.x, leftHandData.y, leftHandData.z), 0.28);
          grabbedObject.userData.grabbed = true;
        }
      } else {
        if (grabbedObject) grabbedObject.userData.grabbed = false;
        grabbedObject = null;
      }

      // Tay phải: Scale
      if (rightHandData && rightHandData.pinch && grabbedObject) {
        const scale = THREE.MathUtils.clamp(0.55 + (0.055 - 0.03) * 20, 0.4, 2.9);
        grabbedObject.scale.lerp(new THREE.Vector3(scale, scale, scale), 0.15);
      }

      // Cả 2 tay mở
      if (leftHandData && rightHandData && !leftHandData.pinch && !rightHandData.pinch) {
        objects.forEach(obj => {
          obj.rotation.x += 0.025;
          obj.rotation.y += 0.035;
          obj.material.emissiveIntensity = 1.1;
        });
        statusEl.textContent = "⚡ ENERGY FIELD MAXIMUM";
      } else {
        objects.forEach(obj => obj.material.emissiveIntensity = 0.55);
        if (leftHandData && rightHandData) statusEl.textContent = "Cả 2 tay đang hoạt động • Khung tay đang theo dõi";
        else if (leftHandData) statusEl.textContent = "Tay trái (xanh) đang điều khiển";
        else if (rightHandData) statusEl.textContent = "Tay phải (hồng) đang điều khiển";
      }
    }

    // ====================== ANIMATE ======================
    function animate() {
      requestAnimationFrame(animate);

      objects.forEach(obj => {
        if (!obj.userData.grabbed) {
          obj.rotation.x += 0.005;
          obj.rotation.y += 0.007;
        }
      });

      // Particles
      const arr = particles.geometry.attributes.position.array;
      for (let i = 1; i < arr.length; i += 3) {
        arr[i] += 0.004;
        if (arr[i] > 7) arr[i] = -7;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hologram Frame - Cử chỉ tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    video {
      transform: scaleX(-1);
    }
    #effectCanvas {
      z-index: 5;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      z-index: 20;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="effectCanvas"></canvas>
    <div id="status">Đưa tay vào khung hình để hiện Hologram</div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("effectCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let scanOffset = 0;
    let time = 0;

    // Tính vùng bao quanh bàn tay
    function getHandBoundingBox(landmarks, width, height) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;

      for (const point of landmarks) {
        if (point.x < minX) minX = point.x;
        if (point.x > maxX) maxX = point.x;
        if (point.y < minY) minY = point.y;
        if (point.y > maxY) maxY = point.y;
      }

      // Thêm khoảng trống cho khung đẹp
      const pad = 0.09;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(1, maxX + pad);
      maxY = Math.min(1, maxY + pad);

      return {
        x: minX * width,
        y: minY * height,
        w: (maxX - minX) * width,
        h: (maxY - minY) * height
      };
    }

    // Vẽ khung Hologram
    function drawHologramFrame(box) {
      const { x, y, w, h } = box;
      const radius = 16;

      ctx.save();

      // ===== Glow mạnh =====
      ctx.shadowColor = "#00f0ff";
      ctx.shadowBlur = 30;

      // Viền ngoài chính
      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 3;
      roundRect(ctx, x, y, w, h, radius);
      ctx.stroke();

      // Viền trong mỏng
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1.5;
      roundRect(ctx, x + 6, y + 6, w - 12, h - 12, radius - 4);
      ctx.stroke();

      // ===== 4 góc hologram =====
      const corner = 26;
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#00f0ff";
      ctx.shadowBlur = 15;

      // Trên trái
      ctx.beginPath();
      ctx.moveTo(x, y + corner);
      ctx.lineTo(x, y);
      ctx.lineTo(x + corner, y);
      ctx.stroke();

      // Trên phải
      ctx.beginPath();
      ctx.moveTo(x + w - corner, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + corner);
      ctx.stroke();

      // Dưới trái
      ctx.beginPath();
      ctx.moveTo(x, y + h - corner);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + corner, y + h);
      ctx.stroke();

      // Dưới phải
      ctx.beginPath();
      ctx.moveTo(x + w - corner, y + h);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w, y + h - corner);
      ctx.stroke();

      // ===== Đường scan chạy =====
      scanOffset += 3;
      if (scanOffset > h) scanOffset = 0;

      ctx.shadowBlur = 0;
      const gradient = ctx.createLinearGradient(x, y + scanOffset - 30, x, y + scanOffset + 30);
      gradient.addColorStop(0, "transparent");
      gradient.addColorStop(0.5, "rgba(0, 240, 255, 0.45)");
      gradient.addColorStop(1, "transparent");

      ctx.fillStyle = gradient;
      ctx.fillRect(x + 8, y + 8, w - 16, h - 16);

      // ===== Hiệu ứng nhấp nháy nhẹ =====
      time += 0.05;
      const alpha = 0.08 + Math.sin(time) * 0.04;
      ctx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
      ctx.fillRect(x + 8, y + 8, w - 16, h - 16);

      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Đưa tay vào khung hình để hiện Hologram";
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const box = getHandBoundingBox(landmarks, canvas.width, canvas.height);

      statusEl.textContent = "Hologram đang kích hoạt";
      drawHologramFrame(box);
    }

    async function start() {
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.75,
        minTrackingConfidence: 0.65
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera!";
    });
  </script>
</body>
</html>

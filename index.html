<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Lab - VIP Pro (2 Tay)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 240px;
      height: 180px;
      border: 2px solid #00f0ff;
      border-radius: 14px;
      transform: scaleX(-1);
      z-index: 100;
      background: #0a0a12;
      object-fit: cover;
    }
    #status {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 10, 20, 0.85);
      border: 1px solid #00f0ff55;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 15px;
      color: #00f0ff;
      z-index: 100;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 8, 18, 0.88);
      border: 1px solid #00f0ff44;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.65;
      color: #7af0ff;
      z-index: 100;
      max-width: 300px;
      backdrop-filter: blur(10px);
    }
    .hint b { color: #00f0ff; }
    .hand-label {
      position: absolute;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="status">Đang khởi động Hệ thống Lab VIP Pro...</div>

  <div class="hint">
    <b>PHÒNG THÍ NGHIỆM HOLOGRAPHIC - VIP PRO</b><br><br>
    <b>Tay Trái:</b> Chụm ngón → Kéo & Di chuyển vật thể<br>
    <b>Tay Phải:</b> Chụm ngón → Phóng to / Thu nhỏ<br>
    <b>Cả 2 tay mở:</b> Kích hoạt Energy Field<br>
    <b>Pinch mạnh tay phải:</b> Bắn năng lượng
  </div>

  <!-- Three.js + MediaPipe -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ====================== SCENE SETUP ======================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050a);
    scene.fog = new THREE.FogExp2(0x02050a, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0x112233, 0.6);
    scene.add(ambient);

    const point1 = new THREE.PointLight(0x00f0ff, 2.5, 20);
    point1.position.set(3, 4, 2);
    scene.add(point1);

    const point2 = new THREE.PointLight(0xff00aa, 1.8, 18);
    point2.position.set(-3, 2, -1);
    scene.add(point2);

    // Grid floor
    const grid = new THREE.GridHelper(20, 40, 0x00f0ff, 0x003344);
    grid.position.y = -1.5;
    scene.add(grid);

    // ====================== HOLOGRAPHIC OBJECTS ======================
    const objects = [];
    const colors = [0x00f0ff, 0xff00aa, 0x00ff88, 0xffaa00, 0xaa00ff];

    function createHoloObject(type, x, y, z, color) {
      let geometry;
      if (type === 'sphere') geometry = new THREE.SphereGeometry(0.45, 32, 32);
      else if (type === 'box') geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
      else geometry = new THREE.OctahedronGeometry(0.5);

      const material = new THREE.MeshPhysicalMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.4,
        metalness: 0.3,
        roughness: 0.15,
        transparent: true,
        opacity: 0.85,
        transmission: 0.3
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.userData = { originalScale: 1, velocity: new THREE.Vector3(), grabbed: false };
      scene.add(mesh);
      objects.push(mesh);

      // Glow sprite
      const spriteMat = new THREE.SpriteMaterial({
        map: createGlowTexture(color),
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.5
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(2.2, 2.2, 1);
      mesh.add(sprite);

      return mesh;
    }

    function createGlowTexture(color) {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, '#' + color.toString(16).padStart(6, '0'));
      gradient.addColorStop(0.4, '#' + color.toString(16).padStart(6, '0') + '88');
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    // Tạo các vật thể
    createHoloObject('sphere', -2.2, 0.8, 0, 0x00f0ff);
    createHoloObject('box', 0, 1.2, -1, 0xff00aa);
    createHoloObject('octa', 2.3, 0.6, 0.5, 0x00ff88);
    createHoloObject('sphere', -1, -0.3, 1.5, 0xffaa00);
    createHoloObject('box', 1.5, -0.2, -1.5, 0xaa00ff);

    // ====================== HAND CURSORS ======================
    const leftCursor = createCursor(0x00f0ff);
    const rightCursor = createCursor(0xff00aa);
    scene.add(leftCursor);
    scene.add(rightCursor);

    function createCursor(color) {
      const geo = new THREE.SphereGeometry(0.12, 16, 16);
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.visible = false;

      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.18, 0.22, 32),
        new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
      );
      ring.rotation.x = Math.PI / 2;
      mesh.add(ring);
      return mesh;
    }

    // ====================== PARTICLES ======================
    const particleCount = 400;
    const particles = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 18;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 0.04,
      transparent: true,
      opacity: 0.4,
      blending: THREE.AdditiveBlending
    });
    const particleSystem = new THREE.Points(particles, particleMat);
    scene.add(particleSystem);

    // ====================== HAND TRACKING ======================
    const video = document.getElementById('webcam');
    const statusEl = document.getElementById('status');

    let leftHand = null, rightHand = null;
    let leftPinch = false, rightPinch = false;
    let grabbedObject = null;

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    const cam = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });

    cam.start()
      .then(() => statusEl.textContent = "Hệ thống sẵn sàng — Đưa cả 2 tay vào khung hình")
      .catch(err => {
        statusEl.innerHTML = `<span style="color:#ff5555">Lỗi Camera!</span><br>Hãy chạy bằng <b>Live Server</b> hoặc python -m http.server`;
      });

    function onResults(results) {
      leftHand = null;
      rightHand = null;
      leftCursor.visible = false;
      rightCursor.visible = false;

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Không thấy tay — Đưa cả 2 tay vào khung";
        return;
      }

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const handedness = results.multiHandedness[i].label; // "Left" or "Right"
        const isLeft = handedness === "Left"; // vì video bị lật gương

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];
        const wrist = landmarks[0];

        // Chuyển từ tọa độ MediaPipe sang không gian 3D
        const x = (0.5 - indexTip.x) * 8;
        const y = (0.5 - indexTip.y) * 5 + 0.5;
        const z = -indexTip.z * 4;

        const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        const isPinching = dist < 0.055;

        if (isLeft) {
          leftHand = { x, y, z, pinch: isPinching };
          leftCursor.position.set(x, y, z);
          leftCursor.visible = true;
          leftPinch = isPinching;
        } else {
          rightHand = { x, y, z, pinch: isPinching };
          rightCursor.position.set(x, y, z);
          rightCursor.visible = true;
          rightPinch = isPinching;
        }
      }

      // === LOGIC TƯƠNG TÁC ===
      // Tay trái: Grab & Move
      if (leftHand && leftHand.pinch) {
        if (!grabbedObject) {
          // Tìm object gần nhất
          let minDist = 1.2;
          objects.forEach(obj => {
            const d = obj.position.distanceTo(new THREE.Vector3(leftHand.x, leftHand.y, leftHand.z));
            if (d < minDist) {
              minDist = d;
              grabbedObject = obj;
            }
          });
        }
        if (grabbedObject) {
          grabbedObject.position.lerp(new THREE.Vector3(leftHand.x, leftHand.y, leftHand.z), 0.25);
          grabbedObject.userData.grabbed = true;
        }
      } else {
        if (grabbedObject) grabbedObject.userData.grabbed = false;
        grabbedObject = null;
      }

      // Tay phải: Scale
      if (rightHand && rightHand.pinch && grabbedObject) {
        const scale = 0.6 + (0.055 - Math.hypot(
          results.multiHandLandmarks[0][4].x - results.multiHandLandmarks[0][8].x,
          results.multiHandLandmarks[0][4].y - results.multiHandLandmarks[0][8].y
        )) * 18;
        grabbedObject.scale.setScalar(THREE.MathUtils.clamp(scale, 0.4, 2.8));
      }

      // Cả 2 tay mở → Energy Field
      const bothOpen = leftHand && rightHand && !leftHand.pinch && !rightHand.pinch;
      if (bothOpen) {
        objects.forEach(obj => {
          obj.rotation.x += 0.02;
          obj.rotation.y += 0.03;
          obj.material.emissiveIntensity = 0.9;
        });
        statusEl.textContent = "⚡ ENERGY FIELD ACTIVATED";
      } else {
        objects.forEach(obj => obj.material.emissiveIntensity = 0.4);
        if (leftHand && rightHand) statusEl.textContent = "Cả 2 tay đang hoạt động";
        else if (leftHand) statusEl.textContent = "Tay trái đang điều khiển";
        else if (rightHand) statusEl.textContent = "Tay phải đang điều khiển";
      }
    }

    // ====================== ANIMATION LOOP ======================
    function animate() {
      requestAnimationFrame(animate);

      // Xoay nhẹ các object khi không bị nắm
      objects.forEach(obj => {
        if (!obj.userData.grabbed) {
          obj.rotation.x += 0.004;
          obj.rotation.y += 0.006;
        }
      });

      // Particle drift
      const pos = particleSystem.geometry.attributes.position.array;
      for (let i = 1; i < pos.length; i += 3) {
        pos[i] += 0.003;
        if (pos[i] > 6) pos[i] = -6;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bàn phím ảo 2 Tay - Cảm biến chuẩn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #070714, #001525);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      margin-bottom: 14px;
      padding: 8px 22px;
      background: rgba(0,240,255,0.1);
      border: 1px solid #00f0ff55;
      border-radius: 30px;
      font-size: 14px;
      color: #00f0ff;
    }

    #text-area {
      width: 92%;
      max-width: 920px;
      min-height: 130px;
      background: rgba(0, 18, 36, 0.85);
      border: 2px solid #00f0ff55;
      border-radius: 16px;
      padding: 18px 22px;
      font-size: 23px;
      line-height: 1.5;
      color: #e0f7ff;
      margin-bottom: 22px;
      resize: none;
      outline: none;
      box-shadow: 0 0 30px #00f0ff22;
    }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 96%;
      max-width: 1000px;
      user-select: none;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .key {
      background: linear-gradient(145deg, #0c1f33, #071522);
      border: 1px solid #00f0ff40;
      border-radius: 10px;
      color: #b8eaff;
      font-size: 17px;
      font-weight: 500;
      min-width: 51px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.11s ease;
      box-shadow: 0 4px 0 #002233;
      position: relative;
    }

    .key.hover-left {
      background: linear-gradient(145deg, #00c4d4, #0099bb);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #005566;
    }
    .key.hover-right {
      background: linear-gradient(145deg, #ff66bb, #ee2288);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #880044;
    }

    .key.active {
      transform: translateY(3px) !important;
      box-shadow: 0 1px 0 #003344 !important;
    }

    .key.wide { min-width: 88px; }
    .key.space { min-width: 340px; }
    .key.shift { min-width: 96px; }
    .key.enter { min-width: 96px; }
    .key.backspace { min-width: 96px; }

    #webcam {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 210px;
      height: 158px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      transform: scaleX(-1);
      background: #000;
      z-index: 100;
      box-shadow: 0 0 20px #00f0ff55;
    }

    .cursor {
      position: fixed;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%, -50%);
      display: none;
      transition: transform 0.04s linear;
    }
    #cursor-left {
      border: 3px solid #00f0ff;
      box-shadow: 0 0 14px #00f0ff, inset 0 0 6px #00f0ff;
    }
    #cursor-right {
      border: 3px solid #ff00aa;
      box-shadow: 0 0 14px #ff00aa, inset 0 0 6px #ff00aa;
    }
    .cursor.pinch {
      transform: translate(-50%, -50%) scale(0.65);
      background: rgba(255,255,255,0.25);
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 18px;
      background: rgba(0,12,25,0.92);
      border: 1px solid #00f0ff40;
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #8af4ff;
      max-width: 250px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <h1>Bàn phím ảo 2 Tay</h1>
  <div id="status">Đang khởi động camera...</div>

  <textarea id="text-area" placeholder="Gõ chữ bằng cả 2 tay ở đây..."></textarea>

  <div id="keyboard"></div>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="cursor-left" class="cursor"></div>
  <div id="cursor-right" class="cursor"></div>

  <div class="hint">
    <b>Hướng dẫn 2 tay:</b><br>
    • Tay trái (xanh) + Tay phải (hồng)<br>
    • Di chuyển ngón trỏ = chọn phím<br>
    • Chụm ngón cái + trỏ = nhấn<br>
    • Cả 2 tay dùng độc lập
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ====================== BÀN PHÍM ======================
    const layout = [
      ['1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']'],
      ['a','s','d','f','g','h','j','k','l',';',"'",'Enter'],
      ['Shift','z','x','c','v','b','n','m',',','.','/','Backspace'],
      ['Space']
    ];

    const keyboardEl = document.getElementById('keyboard');
    const textArea = document.getElementById('text-area');
    let isShift = false;
    const lastPressTime = { left: 0, right: 0 };

    layout.forEach(row => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      row.forEach(key => {
        const keyEl = document.createElement('div');
        keyEl.className = 'key';
        keyEl.dataset.key = key;

        if (key === 'Space') keyEl.classList.add('space');
        if (key === 'Shift') keyEl.classList.add('shift');
        if (key === 'Enter') keyEl.classList.add('enter');
        if (key === 'Backspace') keyEl.classList.add('backspace');
        if (['Space','Shift','Enter','Backspace'].includes(key)) keyEl.classList.add('wide');

        keyEl.textContent = key === 'Space' ? '␣ Space' : key;
        rowDiv.appendChild(keyEl);
      });
      keyboardEl.appendChild(rowDiv);
    });

    function pressKey(key, hand) {
      const now = Date.now();
      if (now - lastPressTime[hand] < 320) return;
      lastPressTime[hand] = now;

      const keyEl = document.querySelector(`.key[data-key="${key}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 140);
      }

      if (key === 'Backspace') {
        textArea.value = textArea.value.slice(0, -1);
      } else if (key === 'Enter') {
        textArea.value += '\n';
      } else if (key === 'Space') {
        textArea.value += ' ';
      } else if (key === 'Shift') {
        isShift = !isShift;
        updateShiftUI();
      } else {
        let char = key;
        if (isShift) {
          char = char.toUpperCase();
          isShift = false;
          updateShiftUI();
        }
        textArea.value += char;
      }
      textArea.focus();
      textArea.scrollTop = textArea.scrollHeight;
    }

    function updateShiftUI() {
      document.querySelectorAll('.key[data-key="Shift"]').forEach(k => {
        k.style.background = isShift ? 'linear-gradient(145deg, #00f0ff, #00aaff)' : '';
        k.style.color = isShift ? '#000' : '';
      });
    }

    // ====================== HAND TRACKING 2 TAY ======================
    const video = document.getElementById('webcam');
    const cursorLeft = document.getElementById('cursor-left');
    const cursorRight = document.getElementById('cursor-right');
    const status = document.getElementById('status');

    // Smoothing
    const smooth = {
      left: { x: 0, y: 0 },
      right: { x: 0, y: 0 }
    };
    const lastPinch = { left: false, right: false };

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.72,
      minTrackingConfidence: 0.72
    });

    hands.onResults(results => {
      // Reset hover
      document.querySelectorAll('.key').forEach(k => {
        k.classList.remove('hover-left', 'hover-right');
      });

      cursorLeft.style.display = 'none';
      cursorRight.style.display = 'none';

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        status.textContent = 'Không thấy tay – Đưa cả 2 tay vào khung hình';
        return;
      }

      let activeHands = 0;

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const label = results.multiHandedness[i].label; // "Left" hoặc "Right"
        const isLeft = label === "Left"; // vì video bị lật

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // Tọa độ thô
        let rawX = (1 - indexTip.x) * window.innerWidth;
        let rawY = indexTip.y * window.innerHeight;

        // Smoothing
        const hand = isLeft ? 'left' : 'right';
        smooth[hand].x += (rawX - smooth[hand].x) * 0.35;
        smooth[hand].y += (rawY - smooth[hand].y) * 0.35;

        const x = smooth[hand].x;
        const y = smooth[hand].y;

        // Cursor
        const cursor = isLeft ? cursorLeft : cursorRight;
        cursor.style.display = 'block';
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';

        // Pinch detection (chuẩn hơn)
        const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
        const isPinching = dist < 0.048;

        if (isPinching) cursor.classList.add('pinch');
        else cursor.classList.remove('pinch');

        // Tìm phím đang trỏ
        let hoveredKey = null;
        document.querySelectorAll('.key').forEach(keyEl => {
          const rect = keyEl.getBoundingClientRect();
          // Vùng hit rộng hơn một chút
          const padding = 6;
          if (x >= rect.left - padding && x <= rect.right + padding &&
              y >= rect.top - padding && y <= rect.bottom + padding) {
            keyEl.classList.add(isLeft ? 'hover-left' : 'hover-right');
            hoveredKey = keyEl.dataset.key;
          }
        });

        // Nhấn phím
        if (isPinching && !lastPinch[hand] && hoveredKey) {
          pressKey(hoveredKey, hand);
        }
        lastPinch[hand] = isPinching;

        activeHands++;
      }

      if (activeHands === 2) status.textContent = 'Cả 2 tay đang hoạt động';
      else if (activeHands === 1) status.textContent = '1 tay đang hoạt động';
    });

    // Camera
    const camera = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });

    camera.start()
      .then(() => status.textContent = 'Camera sẵn sàng – Đưa cả 2 tay vào khung')
      .catch(() => {
        status.innerHTML = '<span style="color:#ff5555">Lỗi camera!</span> Hãy chạy bằng Live Server';
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Earth 3D Hand Control PRO</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#earth{
    position:fixed;
    inset:0;
}
</style>
</head>

<body>

<div id="earth"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>

<script>
const globe = Globe()(document.getElementById("earth"))
    .backgroundColor("#000")
    .showAtmosphere(true)
    .atmosphereColor("#20bfff")
    .atmosphereAltitude(0.15)
    .globeImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-night.jpg"
    )
    .bumpImageUrl(
        "https://unpkg.com/three-globe/example/img/earth-topology.png"
    );

globe.pointOfView({
    lat:20,
    lng:105,
    altitude:2.2
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khung hình ảo bằng cử chỉ tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    video {
      transform: scaleX(-1);
    }
    #effectCanvas {
      z-index: 5;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }
    .btn {
      background: rgba(0,0,0,0.65);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      z-index: 20;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="effectCanvas"></canvas>

    <div id="ui">
      <button class="btn" onclick="toggleFrame()">Bật/Tắt khung</button>
    </div>
    <div id="status">Đưa tay vào khung hình</div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("effectCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let showFrame = true;
    let frameColor = "#00f0ff"; // màu neon mặc định

    function toggleFrame() {
      showFrame = !showFrame;
    }

    // Tính vùng bao quanh bàn tay
    function getHandBoundingBox(landmarks, width, height) {
      let minX = 1, minY = 1, maxX = 0, maxY = 0;

      for (const point of landmarks) {
        if (point.x < minX) minX = point.x;
        if (point.x > maxX) maxX = point.x;
        if (point.y < minY) minY = point.y;
        if (point.y > maxY) maxY = point.y;
      }

      // Thêm padding cho khung đẹp hơn
      const padding = 0.08;
      minX = Math.max(0, minX - padding);
      minY = Math.max(0, minY - padding);
      maxX = Math.min(1, maxX + padding);
      maxY = Math.min(1, maxY + padding);

      return {
        x: minX * width,
        y: minY * height,
        w: (maxX - minX) * width,
        h: (maxY - minY) * height
      };
    }

    // Vẽ khung hình ảo đẹp
    function drawVirtualFrame(box) {
      const { x, y, w, h } = box;
      const radius = 18;
      const lineWidth = 5;

      ctx.save();

      // Glow ngoài
      ctx.shadowColor = frameColor;
      ctx.shadowBlur = 25;
      ctx.strokeStyle = frameColor;
      ctx.lineWidth = lineWidth;

      // Khung chính bo góc
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.stroke();

      // Viền trong mỏng hơn
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.stroke();

      // 4 góc trang trí
      const cornerSize = 22;
      ctx.lineWidth = 3;
      ctx.strokeStyle = frameColor;

      // Góc trên trái
      ctx.beginPath();
      ctx.moveTo(x, y + cornerSize);
      ctx.lineTo(x, y);
      ctx.lineTo(x + cornerSize, y);
      ctx.stroke();

      // Góc trên phải
      ctx.beginPath();
      ctx.moveTo(x + w - cornerSize, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + cornerSize);
      ctx.stroke();

      // Góc dưới trái
      ctx.beginPath();
      ctx.moveTo(x, y + h - cornerSize);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + cornerSize, y + h);
      ctx.stroke();

      // Góc dưới phải
      ctx.beginPath();
      ctx.moveTo(x + w - cornerSize, y + h);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w, y + h - cornerSize);
      ctx.stroke();

      ctx.restore();
    }

    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Đưa tay vào khung hình";
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const box = getHandBoundingBox(landmarks, canvas.width, canvas.height);

      statusEl.textContent = "Đã phát hiện tay - Khung hình ảo đang hiện";

      if (showFrame) {
        drawVirtualFrame(box);
      }
    }

    async function start() {
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.75,
        minTrackingConfidence: 0.65
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera!";
    });
  </script>
</body>
</html>

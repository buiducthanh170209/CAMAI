<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Catch - Game dùng Webcam</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050510;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
      pointer-events: none;
    }
    .score-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #00f0ff55;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 22px;
      color: #00f0ff;
      backdrop-filter: blur(8px);
    }
    #status {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 16px;
      color: #00f0ff;
      z-index: 10;
    }
    #webcam {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 150px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      transform: scaleX(-1);
      z-index: 20;
      opacity: 0.85;
    }
    #startScreen {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 16, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #startScreen h1 {
      font-size: 56px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    #startScreen p {
      font-size: 20px;
      color: #aaa;
      margin-bottom: 40px;
    }
    button {
      padding: 16px 48px;
      font-size: 20px;
      background: linear-gradient(90deg, #00f0ff, #00aaff);
      border: none;
      border-radius: 50px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px #00f0ff88;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <video id="webcam" autoplay playsinline muted></video>

  <div id="ui">
    <div class="score-box">Điểm: <span id="score">0</span></div>
    <div class="score-box">Máu: <span id="lives">5</span></div>
  </div>
  <div id="status">Đưa tay vào khung hình để chơi</div>

  <div id="startScreen">
    <h1>NEON CATCH</h1>
    <p>Bắt quả cầu bằng tay • Tránh quả bom</p>
    <button onclick="startGame()">BẮT ĐẦU</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const statusEl = document.getElementById('status');
    const startScreen = document.getElementById('startScreen');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let score = 0;
    let lives = 5;
    let gameRunning = false;
    let objects = [];
    let particles = [];
    let handX = width / 2;
    let handY = height / 2;
    let handOpen = false;
    let lastSpawn = 0;

    // Hand tracking
    const video = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        // Dùng điểm giữa lòng bàn tay (landmark 9)
        handX = (1 - lm[9].x) * width;
        handY = lm[9].y * height;

        // Kiểm tra bàn tay mở hay khép
        const thumb = lm[4];
        const index = lm[8];
        const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        handOpen = dist > 0.1;

        statusEl.textContent = handOpen ? "Bàn tay mở - Sẵn sàng bắt!" : "Chụm tay lại để chuẩn bị";
      } else {
        statusEl.textContent = "Không thấy tay - Đưa tay vào khung hình";
      }
    });

    const camera = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });
    camera.start();

    // Objects
    class FallingObject {
      constructor() {
        this.x = Math.random() * (width - 80) + 40;
        this.y = -50;
        this.radius = 28 + Math.random() * 18;
        this.speed = 3 + Math.random() * 3 + score * 0.02;
        this.isBomb = Math.random() < 0.18; // 18% là bom
        this.color = this.isBomb ? '#ff2244' : `hsl(${Math.random()*360}, 100%, 60%)`;
        this.caught = false;
      }
      update() {
        this.y += this.speed;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 25;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (this.isBomb) {
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('💣', this.x, this.y + 7);
        }
      }
    }

    function spawnObject() {
      objects.push(new FallingObject());
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          life: 30,
          color
        });
      }
    }

    function startGame() {
      startScreen.style.display = 'none';
      score = 0;
      lives = 5;
      objects = [];
      particles = [];
      gameRunning = true;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function gameOver() {
      gameRunning = false;
      startScreen.style.display = 'flex';
      startScreen.querySelector('h1').textContent = 'GAME OVER';
      startScreen.querySelector('p').textContent = `Điểm của bạn: ${score}`;
      startScreen.querySelector('button').textContent = 'CHƠI LẠI';
    }

    // Game loop
    function animate(time) {
      ctx.fillStyle = 'rgba(5, 5, 16, 0.25)'; // motion trail
      ctx.fillRect(0, 0, width, height);

      // Vẽ tay
      ctx.beginPath();
      ctx.arc(handX, handY, handOpen ? 55 : 35, 0, Math.PI * 2);
      ctx.strokeStyle = handOpen ? '#00f0ff' : '#ff00aa';
      ctx.lineWidth = 4;
      ctx.shadowColor = handOpen ? '#00f0ff' : '#ff00aa';
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;

      if (gameRunning) {
        // Spawn
        if (time - lastSpawn > Math.max(600, 1200 - score * 8)) {
          spawnObject();
          lastSpawn = time;
        }

        // Update objects
        for (let i = objects.length - 1; i >= 0; i--) {
          const obj = objects[i];
          obj.update();
          obj.draw();

          // Kiểm tra bắt
          const dist = Math.hypot(obj.x - handX, obj.y - handY);
          if (dist < obj.radius + (handOpen ? 55 : 35)) {
            if (obj.isBomb) {
              lives--;
              livesEl.textContent = lives;
              createParticles(obj.x, obj.y, '#ff2244');
              if (lives <= 0) gameOver();
            } else {
              score += 10;
              scoreEl.textContent = score;
              createParticles(obj.x, obj.y, obj.color);
            }
            objects.splice(i, 1);
            continue;
          }

          // Rơi hết màn hình
          if (obj.y > height + 50) {
            if (!obj.isBomb) {
              lives--;
              livesEl.textContent = lives;
              if (lives <= 0) gameOver();
            }
            objects.splice(i, 1);
          }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.globalAlpha = p.life / 30;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Fruit Ninja - 2 Tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0510;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #gameCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #ui {
      position: absolute;
      top: 18px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
      pointer-events: none;
    }
    .box {
      background: rgba(0,0,0,0.65);
      border: 1px solid #00f0ff55;
      padding: 10px 22px;
      border-radius: 14px;
      font-size: 20px;
      color: #00f0ff;
      backdrop-filter: blur(8px);
    }
    #combo {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
      color: #ffff00;
      text-shadow: 0 0 15px #ff0;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
    }
    #status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 15px;
      color: #00f0ff;
      z-index: 10;
    }
    #webcam {
      position: absolute;
      bottom: 18px;
      right: 18px;
      width: 180px;
      height: 135px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      transform: scaleX(-1);
      z-index: 20;
      opacity: 0.85;
    }
    #startScreen {
      position: absolute;
      inset: 0;
      background: rgba(10,5,16,0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #startScreen h1 {
      font-size: 52px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    #startScreen p {
      font-size: 18px;
      color: #bbb;
      margin-bottom: 10px;
      text-align: center;
      line-height: 1.6;
    }
    button {
      margin-top: 28px;
      padding: 15px 50px;
      font-size: 20px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      border: none;
      border-radius: 50px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 30px #00f0ff88;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <video id="webcam" autoplay playsinline muted></video>

  <div id="ui">
    <div class="box">Điểm: <span id="score">0</span></div>
    <div class="box">Máu: <span id="lives">5</span></div>
  </div>
  <div id="combo">COMBO x2</div>
  <div id="status">Dùng 2 tay như kiếm để chém hoa quả</div>

  <div id="startScreen">
    <h1>NEON FRUIT NINJA</h1>
    <p>
      Dùng <b>cả 2 tay</b> như 2 thanh kiếm<br>
      Chém hoa quả • Tránh bom<br>
      Càng chém nhanh càng nhiều điểm
    </p>
    <button onclick="startGame()">BẮT ĐẦU</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const comboEl = document.getElementById('combo');
    const statusEl = document.getElementById('status');
    const startScreen = document.getElementById('startScreen');

    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game state
    let score = 0;
    let lives = 5;
    let combo = 0;
    let gameRunning = false;
    let fruits = [];
    let particles = [];
    let lastSpawn = 0;
    let lastComboTime = 0;

    // Hands
    let leftBlade = null;
    let rightBlade = null;
    let prevLeft = null;
    let prevRight = null;

    // MediaPipe
    const video = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      leftBlade = null;
      rightBlade = null;

      if (!results.multiHandLandmarks) {
        statusEl.textContent = "Không thấy tay - Đưa cả 2 tay vào khung hình";
        return;
      }

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const lm = results.multiHandLandmarks[i];
        const label = results.multiHandedness[i].label;
        const isLeft = label === "Left";

        // Dùng ngón trỏ làm lưỡi kiếm
        const tip = lm[8];
        const x = (1 - tip.x) * W;
        const y = tip.y * H;

        if (isLeft) leftBlade = { x, y };
        else rightBlade = { x, y };
      }

      if (leftBlade && rightBlade) statusEl.textContent = "Cả 2 thanh kiếm sẵn sàng!";
      else if (leftBlade) statusEl.textContent = "Tay trái đang hoạt động";
      else if (rightBlade) statusEl.textContent = "Tay phải đang hoạt động";
    });

    const camera = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });
    camera.start();

    // Fruit class
    class Fruit {
      constructor() {
        this.x = 100 + Math.random() * (W - 200);
        this.y = H + 40;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = -18 - Math.random() * 10;
        this.radius = 32 + Math.random() * 18;
        this.rotation = 0;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
        this.isBomb = Math.random() < 0.18;
        this.sliced = false;
        this.color = this.isBomb ? '#ff2244' : `hsl(${Math.random() * 360}, 100%, 60%)`;
        this.gravity = 0.35;
      }

      update() {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.isBomb) {
          // Bom
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#222';
          ctx.fill();
          ctx.strokeStyle = '#ff2244';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.fillStyle = '#ff2244';
          ctx.font = 'bold 28px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('💣', 0, 2);
        } else {
          // Hoa quả
          ctx.beginPath();
          ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 25;
          ctx.fill();
          ctx.shadowBlur = 0;
          
          // Highlight
          ctx.beginPath();
          ctx.arc(-this.radius*0.3, -this.radius*0.3, this.radius*0.3, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function createJuice(x, y, color) {
      for (let i = 0; i < 16; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          life: 30 + Math.random() * 20,
          color,
          size: 3 + Math.random() * 5
        });
      }
    }

    function startGame() {
      startScreen.style.display = 'none';
      score = 0;
      lives = 5;
      combo = 0;
      fruits = [];
      particles = [];
      gameRunning = true;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      comboEl.style.opacity = 0;
    }

    function gameOver() {
      gameRunning = false;
      startScreen.style.display = 'flex';
      startScreen.querySelector('h1').textContent = 'GAME OVER';
      startScreen.querySelector('p').innerHTML = `Điểm của bạn: <b style="color:#00f0ff">${score}</b>`;
      startScreen.querySelector('button').textContent = 'CHƠI LẠI';
    }

    function showCombo() {
      if (combo >= 2) {
        comboEl.textContent = `COMBO x${combo}`;
        comboEl.style.opacity = 1;
        clearTimeout(window.comboTimeout);
        window.comboTimeout = setTimeout(() => {
          comboEl.style.opacity = 0;
        }, 1000);
      }
    }

    // Check slice
    function checkSlice(blade, prevBlade) {
      if (!blade || !prevBlade) return;

      const speed = Math.hypot(blade.x - prevBlade.x, blade.y - prevBlade.y);
      if (speed < 12) return; // phải vung đủ nhanh

      for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        if (f.sliced) continue;

        // Khoảng cách từ đường vung đến quả
        const dist = distToSegment(f.x, f.y, prevBlade.x, prevBlade.y, blade.x, blade.y);
        if (dist < f.radius + 15) {
          f.sliced = true;

          if (f.isBomb) {
            createJuice(f.x, f.y, '#ff2244');
            lives--;
            livesEl.textContent = lives;
            combo = 0;
            if (lives <= 0) gameOver();
          } else {
            createJuice(f.x, f.y, f.color);
            score += 10 + combo * 2;
            scoreEl.textContent = score;
            combo++;
            lastComboTime = performance.now();
            showCombo();
          }
          fruits.splice(i, 1);
        }
      }
    }

    // Helper: khoảng cách từ điểm đến đoạn thẳng
    function distToSegment(px, py, x1, y1, x2, y2) {
      const A = px - x1;
      const B = py - y1;
      const C = x2 - x1;
      const D = y2 - y1;
      const dot = A * C + B * D;
      const lenSq = C * C + D * D;
      let param = lenSq !== 0 ? dot / lenSq : -1;
      let xx, yy;
      if (param < 0) { xx = x1; yy = y1; }
      else if (param > 1) { xx = x2; yy = y2; }
      else { xx = x1 + param * C; yy = y1 + param * D; }
      return Math.hypot(px - xx, py - yy);
    }

    // Game loop
    function animate(time) {
      // Background trail
      ctx.fillStyle = 'rgba(10, 5, 16, 0.3)';
      ctx.fillRect(0, 0, W, H);

      if (gameRunning) {
        // Spawn fruits
        if (time - lastSpawn > Math.max(500, 1100 - score * 2)) {
          fruits.push(new Fruit());
          if (Math.random() < 0.3) fruits.push(new Fruit()); // đôi khi spawn 2 quả
          lastSpawn = time;
        }

        // Update + draw fruits
        for (let i = fruits.length - 1; i >= 0; i--) {
          const f = fruits[i];
          f.update();
          f.draw();

          // Rơi hết màn hình
          if (f.y > H + 80 && !f.sliced) {
            if (!f.isBomb) {
              lives--;
              livesEl.textContent = lives;
              combo = 0;
              if (lives <= 0) gameOver();
            }
            fruits.splice(i, 1);
          }
        }

        // Check slicing
        checkSlice(leftBlade, prevLeft);
        checkSlice(rightBlade, prevRight);

        // Reset combo nếu lâu không chém
        if (time - lastComboTime > 1800) combo = 0;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        ctx.globalAlpha = Math.max(0, p.life / 40);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Draw blades
      if (leftBlade) {
        ctx.beginPath();
        ctx.arc(leftBlade.x, leftBlade.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Trail
        if (prevLeft) {
          ctx.beginPath();
          ctx.moveTo(prevLeft.x, prevLeft.y);
          ctx.lineTo(leftBlade.x, leftBlade.y);
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }
      if (rightBlade) {
        ctx.beginPath();
        ctx.arc(rightBlade.x, rightBlade.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#ff00aa';
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (prevRight) {
          ctx.beginPath();
          ctx.moveTo(prevRight.x, prevRight.y);
          ctx.lineTo(rightBlade.x, rightBlade.y);
          ctx.strokeStyle = 'rgba(255, 0, 170, 0.6)';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
      }

      prevLeft = leftBlade ? { ...leftBlade } : null;
      prevRight = rightBlade ? { ...rightBlade } : null;

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>

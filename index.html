<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hand Gesture Particles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #video, #particleCanvas {
      width: 50%;
      height: 100%;
      object-fit: cover;
    }
    #video {
      transform: scaleX(-1);
      background: #111;
    }
    #particleCanvas {
      background: #000;
    }
    #status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
    }
    @media (max-width: 768px) {
      #container { flex-direction: column; }
      #video, #particleCanvas {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="particleCanvas"></canvas>
  </div>
  <div id="status">Đưa tay vào khung hình</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let particles = [];
    let currentGesture = "none";
    let time = 0;

    // ====================== PARTICLE ======================
    class Particle {
      constructor(x, y, color, type = "normal") {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        this.life = 1;
        this.size = 2 + Math.random() * 3;

        if (type === "spiral") {
          this.angle = Math.random() * Math.PI * 2;
          this.radius = 5 + Math.random() * 10;
          this.speed = 0.05 + Math.random() * 0.05;
          this.centerX = x;
          this.centerY = y;
        } else if (type === "heart") {
          this.vx = (Math.random() - 0.5) * 2;
          this.vy = (Math.random() - 0.5) * 2 - 1;
        } else {
          this.vx = (Math.random() - 0.5) * 4;
          this.vy = (Math.random() - 0.5) * 4;
        }
      }

      update() {
        if (this.type === "spiral") {
          this.angle += this.speed;
          this.radius += 0.3;
          this.x = this.centerX + Math.cos(this.angle) * this.radius;
          this.y = this.centerY + Math.sin(this.angle) * this.radius;
          this.life -= 0.008;
        } else {
          this.x += this.vx;
          this.y += this.vy;
          this.life -= 0.012;
        }
      }

      draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // ====================== ĐẾM NGÓN & NHẬN CỬ CHỈ ======================
    function countFingers(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let count = 0;

      // Ngón cái
      if (landmarks[4].x < landmarks[3].x) count++;

      for (let i = 0; i < 4; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
      }
      return count;
    }

    function detectGesture(landmarks) {
      const fingers = countFingers(landmarks);

      // Peace sign (2 ngón)
      if (fingers === 2) return "peace";

      // 1 ngón trỏ
      if (fingers === 1) return "one";

      // Bàn tay mở
      if (fingers >= 4) return "open";

      // Nắm tay / ít ngón
      if (fingers <= 1) return "fist";

      return "other";
    }

    // ====================== TẠO HIỆU ỨNG THEO CỬ CHỈ ======================
    function spawnParticles(gesture, landmarks) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (gesture === "one") {
        // Xoắn ốc vàng
        for (let i = 0; i < 8; i++) {
          particles.push(new Particle(cx, cy, "#ffaa00", "spiral"));
        }
      } 
      else if (gesture === "peace") {
        // Chữ I LOVE YOU (đơn giản bằng hạt)
        const text = "I LOVE YOU";
        ctx.font = "bold 48px Arial";
        const metrics = ctx.measureText(text);
        const startX = cx - metrics.width / 2;

        for (let i = 0; i < text.length; i++) {
          const x = startX + i * 38;
          for (let j = 0; j < 6; j++) {
            particles.push(new Particle(
              x + (Math.random() - 0.5) * 20,
              cy + (Math.random() - 0.5) * 30,
              "#00e5ff"
            ));
          }
        }
      } 
      else if (gesture === "open") {
        // Hạt xanh bay
        for (let i = 0; i < 15; i++) {
          particles.push(new Particle(
            cx + (Math.random() - 0.5) * 200,
            cy + (Math.random() - 0.5) * 200,
            "#4fc3f7"
          ));
        }
      } 
      else if (gesture === "fist") {
        // Trái tim hồng
        for (let i = 0; i < 12; i++) {
          const t = Math.random() * Math.PI * 2;
          const r = 40 + Math.random() * 30;
          const x = cx + 16 * Math.pow(Math.sin(t), 3);
          const y = cy - (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          particles.push(new Particle(x, y, "#ff2d55", "heart"));
        }
      }
    }

    // ====================== VẼ ======================
    function onResults(results) {
      time++;
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Đưa tay vào khung hình";
        currentGesture = "none";
      } else {
        const landmarks = results.multiHandLandmarks[0];
        const gesture = detectGesture(landmarks);

        if (gesture !== currentGesture) {
          currentGesture = gesture;
          statusEl.textContent = "Cử chỉ: " + gesture.toUpperCase();
        }

        // Spawn hạt liên tục
        if (time % 3 === 0) {
          spawnParticles(gesture, landmarks);
        }
      }

      // Cập nhật & vẽ particle
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw(ctx);
      });
    }

    // ====================== KHỞI ĐỘNG ======================
    async function start() {
      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera!";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vẽ bằng cử chỉ tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video {
      transform: scaleX(-1); /* Lật gương */
      opacity: 0.4;         /* Làm mờ camera để thấy nét vẽ rõ hơn */
    }
    #drawCanvas {
      z-index: 5;
      transform: scaleX(-1); /* Lật cùng chiều với video */
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 20;
      pointer-events: none;
    }
    .btn {
      pointer-events: auto;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .btn:active { transform: scale(0.95); }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 20;
    }
    #status.drawing {
      background: rgba(34, 197, 94, 0.85);
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="drawCanvas"></canvas>

    <div id="ui">
      <button class="btn" onclick="clearCanvas()">Xóa hết</button>
      <button class="btn" onclick="changeColor()">Đổi màu</button>
    </div>

    <div id="status">Đưa ngón trỏ lên để vẽ</div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let currentColor = "#00ff88";
    const colors = ["#00ff88", "#ff2d55", "#00c3ff", "#ffcc00", "#ffffff"];
    let colorIndex = 0;

    // Cấu hình vẽ
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function changeColor() {
      colorIndex = (colorIndex + 1) % colors.length;
      currentColor = colors[colorIndex];
    }

    // Kiểm tra ngón trỏ có đang dơ lên không
    function isIndexFingerUp(landmarks) {
      // landmark 8 = đầu ngón trỏ
      // landmark 6 = khớp giữa ngón trỏ
      // landmark 5 = gốc ngón trỏ
      const tip = landmarks[8];
      const pip = landmarks[6];
      const mcp = landmarks[5];

      // Ngón trỏ dơ khi đầu ngón cao hơn khớp giữa
      return tip.y < pip.y && tip.y < mcp.y;
    }

    function onResults(results) {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        isDrawing = false;
        statusEl.textContent = "Đưa ngón trỏ lên để vẽ";
        statusEl.classList.remove("drawing");
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const indexTip = landmarks[8];

      // Chuyển tọa độ từ 0→1 sang pixel
      const x = indexTip.x * canvas.width;
      const y = indexTip.y * canvas.height;

      if (isIndexFingerUp(landmarks)) {
        statusEl.textContent = "Đang vẽ...";
        statusEl.classList.add("drawing");

        if (!isDrawing) {
          // Bắt đầu nét vẽ mới
          isDrawing = true;
          lastX = x;
          lastY = y;
        } else {
          // Vẽ đường
          ctx.beginPath();
          ctx.strokeStyle = currentColor;
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
          lastX = x;
          lastY = y;
        }
      } else {
        isDrawing = false;
        statusEl.textContent = "Đưa ngón trỏ lên để vẽ";
        statusEl.classList.remove("drawing");
      }
    }

    async function start() {
      // Đồng bộ kích thước canvas
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      // Khởi tạo MediaPipe Hands
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      // Mở camera
      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera. Hãy cho phép quyền truy cập!";
    });
  </script>
</body>
</html>

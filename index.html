<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hand Gesture Particles - Optimized</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
    }
    #video, #particleCanvas {
      width: 50%;
      height: 100%;
      object-fit: cover;
    }
    #video {
      transform: scaleX(-1);
      background: #111;
    }
    #particleCanvas {
      background: #000;
    }
    #status {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 10;
    }
    @media (max-width: 768px) {
      #container { flex-direction: column; }
      #video, #particleCanvas {
        width: 100%;
        height: 50%;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="particleCanvas"></canvas>
  </div>
  <div id="status">Đưa tay vào khung hình</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let particles = [];
    let currentGesture = "none";
    let frameCount = 0;
    const MAX_PARTICLES = 280; // Giới hạn hạt để tránh lag

    class Particle {
      constructor(x, y, color, type = "normal") {
        this.x = x;
        this.y = y;
        this.color = color;
        this.type = type;
        this.life = 1;
        this.size = 2 + Math.random() * 2.5;

        if (type === "spiral") {
          this.angle = Math.random() * Math.PI * 2;
          this.radius = 4 + Math.random() * 8;
          this.speed = 0.06 + Math.random() * 0.04;
          this.centerX = x;
          this.centerY = y;
        } else {
          this.vx = (Math.random() - 0.5) * 3.5;
          this.vy = (Math.random() - 0.5) * 3.5;
        }
      }

      update() {
        if (this.type === "spiral") {
          this.angle += this.speed;
          this.radius += 0.35;
          this.x = this.centerX + Math.cos(this.angle) * this.radius;
          this.y = this.centerY + Math.sin(this.angle) * this.radius;
          this.life -= 0.012;
        } else {
          this.x += this.vx;
          this.y += this.vy;
          this.life -= 0.018;
        }
      }

      draw(ctx) {
        if (this.life <= 0) return;
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function countFingers(landmarks) {
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      let count = 0;
      if (landmarks[4].x < landmarks[3].x) count++;
      for (let i = 0; i < 4; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
      }
      return count;
    }

    function detectGesture(landmarks) {
      const fingers = countFingers(landmarks);
      if (fingers === 2) return "peace";
      if (fingers === 1) return "one";
      if (fingers >= 4) return "open";
      if (fingers <= 1) return "fist";
      return "other";
    }

    function spawnParticles(gesture) {
      if (particles.length > MAX_PARTICLES) return;

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (gesture === "one") {
        for (let i = 0; i < 4; i++) {
          particles.push(new Particle(cx, cy, "#ffaa00", "spiral"));
        }
      } 
      else if (gesture === "peace") {
        const text = "I LOVE YOU";
        const startX = cx - 140;
        for (let i = 0; i < text.length; i++) {
          if (particles.length > MAX_PARTICLES) break;
          particles.push(new Particle(
            startX + i * 32 + (Math.random()-0.5)*12,
            cy + (Math.random()-0.5)*20,
            "#00e5ff"
          ));
        }
      } 
      else if (gesture === "open") {
        for (let i = 0; i < 6; i++) {
          particles.push(new Particle(
            cx + (Math.random()-0.5)*180,
            cy + (Math.random()-0.5)*180,
            "#4fc3f7"
          ));
        }
      } 
      else if (gesture === "fist") {
        for (let i = 0; i < 5; i++) {
          const t = Math.random() * Math.PI * 2;
          const x = cx + 14 * Math.pow(Math.sin(t), 3);
          const y = cy - (12 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          particles.push(new Particle(x, y, "#ff2d55"));
        }
      }
    }

    function onResults(results) {
      frameCount++;

      // Xóa mờ dần
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Đưa tay vào khung hình";
        currentGesture = "none";
      } else {
        const landmarks = results.multiHandLandmarks[0];
        const gesture = detectGesture(landmarks);

        if (gesture !== currentGesture) {
          currentGesture = gesture;
          statusEl.textContent = "Cử chỉ: " + gesture.toUpperCase();
        }

        // Chỉ spawn mỗi 4 frame
        if (frameCount % 4 === 0) {
          spawnParticles(gesture);
        }
      }

      // Cập nhật & vẽ
      ctx.globalAlpha = 1;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    async function start() {
      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,          // Giảm lag
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 480,
        height: 360
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera!";
    });
  </script>
</body>
</html>

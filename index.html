<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Hand Control Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
    #globeViz { width: 100vw; height: 100vh; }
    #webcam {
      position: fixed; bottom: 18px; right: 18px;
      width: 200px; height: 150px;
      border: 2px solid #00f0ff; border-radius: 12px;
      transform: scaleX(-1); z-index: 100; background: #111;
      object-fit: cover;
    }
    #status {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 20px;
      font-size: 14px; color: #00f0ff; z-index: 100; max-width: 90vw; text-align: center;
    }
    .hint {
      position: fixed; bottom: 18px; left: 18px;
      background: rgba(0,0,0,0.75); padding: 12px 16px; border-radius: 12px;
      font-size: 13px; line-height: 1.55; color: #00f0ff; z-index: 100; max-width: 260px;
    }
    #profilePopup {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.92);
      background: rgba(6, 16, 32, 0.97); border: 2px solid #00f0ff; border-radius: 16px;
      padding: 22px; width: 290px; z-index: 1000; box-shadow: 0 0 40px rgba(0,240,255,0.4);
      opacity: 0; pointer-events: none; transition: all 0.22s ease; text-align: center;
    }
    #profilePopup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #profilePopup img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #00f0ff; object-fit: cover; margin-bottom: 12px; }
    #profilePopup h2 { font-size: 22px; margin-bottom: 6px; color: #00f0ff; }
    #profilePopup .info { font-size: 14px; color: #a0e8ff; margin: 5px 0; }
    #profilePopup .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    #profilePopup button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    #profilePopup .join { background: linear-gradient(90deg, #00f0ff, #0088ff); color: #000; }
    #profilePopup .close { background: #333; color: #fff; }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="status">Đang khởi động camera...</div>
  <div class="hint">
    <b>Điều khiển tay (Pro):</b><br>
    • Di chuyển tay → Xoay<br>
    • Chụm ngón cái + trỏ → Zoom<br>
    • Giữ chụm 0.7s → Chọn nước<br>
    • Mở bàn tay → Tự xoay
  </div>

  <div id="profilePopup">
    <img id="pAvatar" src="" alt="avatar">
    <h2 id="pName">Country</h2>
    <div class="info" id="pAge">Tuổi: --</div>
    <div class="info" id="pBirth">Ngày sinh: --</div>
    <div class="info" id="pCountry">Quốc gia: --</div>
    <div class="btn-row">
      <button class="join" onclick="alert('Đã gửi lời mời!')">Join</button>
      <button class="close" onclick="closePopup()">Đóng</button>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.31.0/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ============ DATA ============
    const profiles = {
      "Vietnam": { name: "Quang Trí", age: 23, birth: "12/05/2002", avatar: "https://i.pravatar.cc/150?img=68" },
      "Bangladesh": { name: "Rahim Ahmed", age: 22, birth: "15/03/2003", avatar: "https://i.pravatar.cc/150?img=12" },
      "Japan": { name: "Yuki Tanaka", age: 24, birth: "08/11/2001", avatar: "https://i.pravatar.cc/150?img=33" },
      "South Korea": { name: "Min-jun Park", age: 21, birth: "22/07/2004", avatar: "https://i.pravatar.cc/150?img=47" },
      "Mongolia": { name: "Batbayar", age: 26, birth: "03/01/1999", avatar: "https://i.pravatar.cc/150?img=59" },
      "Cambodia": { name: "Sophea", age: 20, birth: "19/09/2005", avatar: "https://i.pravatar.cc/150?img=25" },
      "Thailand": { name: "Narin", age: 22, birth: "17/08/2003", avatar: "https://i.pravatar.cc/150?img=41" },
      "Indonesia": { name: "Dewi Lestari", age: 25, birth: "30/04/2000", avatar: "https://i.pravatar.cc/150?img=15" },
      "Philippines": { name: "Maria Santos", age: 21, birth: "05/12/2004", avatar: "https://i.pravatar.cc/150?img=9" },
      "Australia": { name: "Liam Wilson", age: 27, birth: "14/02/1998", avatar: "https://i.pravatar.cc/150?img=52" },
      "China": { name: "Li Wei", age: 24, birth: "09/06/2001", avatar: "https://i.pravatar.cc/150?img=60" },
      "India": { name: "Aarav Sharma", age: 23, birth: "28/10/2002", avatar: "https://i.pravatar.cc/150?img=11" },
      "default": { name: "Anonymous", age: 22, birth: "01/01/2003", avatar: "https://i.pravatar.cc/150?img=32" }
    };

    const highlight = {
      "Vietnam":"#ff2222","Cambodia":"#ff3333","Laos":"#ff4444","Thailand":"#ff5555",
      "Myanmar":"#ff6666","Bangladesh":"#ff7777","Japan":"#00ff88","South Korea":"#00ff99",
      "Mongolia":"#00ffaa","China":"#44ff44","India":"#66ff66","Indonesia":"#88ff88",
      "Philippines":"#aaffaa","Australia":"#00aaff"
    };

    // ============ GLOBE ============
    const world = Globe()
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#00f0ff')
      .atmosphereAltitude(0.16)
      .polygonAltitude(0.008)
      .polygonCapColor(d => highlight[d.properties.ADMIN] || '#00cc66')
      .polygonSideColor(() => 'rgba(0,70,35,0.12)')
      .polygonStrokeColor(() => '#00ff88')
      .onPolygonClick(p => showProfile(p.properties.ADMIN))
      (document.getElementById('globeViz'));

    fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
      .then(r => r.json())
      .then(data => world.polygonsData(data.features));

    world.pointOfView({ lat: 15, lng: 105, altitude: 2.15 }, 0);
    const controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    // ============ HAND TRACKING (Tối ưu lag) ============
    const video = document.getElementById('webcam');
    const status = document.getElementById('status');

    let lastX = 0.5, lastY = 0.5;
    let smoothX = 0.5, smoothY = 0.5;
    let isPinching = false;
    let pinchStart = 0;
    let lastClick = 0;
    let lastProcess = 0;
    const PROCESS_INTERVAL = 45; // ms → giảm lag mạnh

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,          // 0 = nhanh nhất
      minDetectionConfidence: 0.55,
      minTrackingConfidence: 0.55
    });

    hands.onResults(results => {
      const now = performance.now();
      if (now - lastProcess < PROCESS_INTERVAL) return;
      lastProcess = now;

      if (!results.multiHandLandmarks?.length) {
        status.textContent = "Không thấy tay – đưa tay vào khung";
        controls.autoRotate = true;
        return;
      }

      const lm = results.multiHandLandmarks[0];
      const index = lm[8];
      const thumb = lm[4];

      // Lật gương
      const rawX = 1 - index.x;
      const rawY = index.y;

      // Smoothing mạnh
      smoothX += (rawX - smoothX) * 0.28;
      smoothY += (rawY - smoothY) * 0.28;

      const dx = (smoothX - lastX) * 95;
      const dy = (smoothY - lastY) * 70;

      if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) {
        controls.autoRotate = false;
        const pov = world.pointOfView();
        world.pointOfView({
          lat: Math.max(-80, Math.min(80, pov.lat - dy * 0.7)),
          lng: pov.lng - dx * 1.1,
          altitude: pov.altitude
        }, 0);
      }

      lastX = smoothX;
      lastY = smoothY;

      // Pinch
      const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
      const pinching = dist < 0.055;

      if (pinching && !isPinching) {
        isPinching = true;
        pinchStart = Date.now();
        status.textContent = "Đang chụm... giữ để chọn";
      }

      if (pinching) {
        // Zoom mượt
        const targetAlt = 2.8 - Math.min(1.6, (0.055 - dist) * 28);
        const curr = world.pointOfView().altitude;
        world.pointOfView({ altitude: curr + (targetAlt - curr) * 0.12 }, 0);

        if (Date.now() - pinchStart > 700 && Date.now() - lastClick > 1400) {
          const list = Object.keys(highlight);
          showProfile(list[Math.floor(Math.random() * list.length)]);
          lastClick = Date.now();
          status.textContent = "Đã chọn nước!";
        }
      } else {
        if (isPinching) {
          isPinching = false;
          status.textContent = "Tay đang điều khiển";
        }
        if (dist > 0.17) {
          controls.autoRotate = true;
          status.textContent = "Bàn tay mở – tự xoay";
        }
      }
    });

    // Camera
    const cam = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 480,   // thấp hơn = mượt hơn
      height: 360
    });

    cam.start()
      .then(() => status.textContent = "Camera OK – đưa tay vào khung hình")
      .catch(err => {
        console.error(err);
        status.innerHTML = `
          <b style="color:#ff5555">Lỗi camera!</b><br>
          Hãy chạy bằng Live Server hoặc<br>
          <code>python -m http.server 8000</code><br>
          rồi mở http://localhost:8000
        `;
      });

    // Popup
    function showProfile(name) {
      const d = profiles[name] || profiles.default;
      document.getElementById('pAvatar').src = d.avatar;
      document.getElementById('pName').textContent = d.name;
      document.getElementById('pAge').textContent = `Tuổi: ${d.age}`;
      document.getElementById('pBirth').textContent = `Ngày sinh: ${d.birth}`;
      document.getElementById('pCountry').textContent = `Quốc gia: ${name}`;
      document.getElementById('profilePopup').classList.add('show');
    }
    function closePopup() {
      document.getElementById('profilePopup').classList.remove('show');
    }
  </script>
</body>
</html>

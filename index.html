from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Earth Hand Control 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff}
#earth{position:fixed;inset:0}
#cameraBox{
 position:fixed;right:16px;bottom:16px;width:230px;height:170px;z-index:10;
 border:1px solid #39eaff;border-radius:12px;overflow:hidden;background:#02080d;
 box-shadow:0 0 25px #007bff55
}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#handCanvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
.camTitle{position:absolute;top:7px;left:9px;z-index:2;font-size:11px;color:#8ff5ff;text-shadow:0 1px 5px #000}
#status{position:fixed;left:16px;bottom:16px;z-index:10;padding:10px 13px;border:1px solid #25475c;border-radius:10px;background:#02090fe8;font-size:12px}
#start{
 position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;
 border:1px solid #42eaff;background:#06232d;color:#a4f7ff;padding:11px 18px;border-radius:9px;
 font-weight:700;cursor:pointer
}
#tip{
 position:fixed;left:50%;bottom:195px;transform:translateX(-50%);z-index:8;
 padding:8px 13px;background:#02090dcc;border:1px solid #25475c;border-radius:8px;
 font-size:12px;color:#b8d3df;text-align:center
}
@media(max-width:600px){
 #cameraBox{width:150px;height:112px;right:8px;bottom:8px}
 #status{left:8px;bottom:8px;font-size:10px}
 #tip{bottom:130px;width:90%;font-size:10px}
}
</style>
</head>
<body>
<div id="earth"></div>

<button id="start">📷 BẬT CAMERA + ĐIỀU KHIỂN BẰNG TAY</button>

<div id="cameraBox">
 <div class="camTitle">HAND TRACKING</div>
 <video id="video" autoplay playsinline muted></video>
 <canvas id="handCanvas"></canvas>
</div>

<div id="tip">
 ☝️ Di chuyển ngón trỏ = xoay Trái Đất &nbsp; • &nbsp;
 🤏 Chụm 2 ngón = zoom &nbsp; • &nbsp; ✋ Mở bàn tay = dừng
</div>
<div id="status">Camera chưa bật</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const earthEl=document.getElementById('earth');
const video=document.getElementById('video');
const canvas=document.getElementById('handCanvas');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');

const globe=Globe()(earthEl)
 .backgroundColor('#000')
 .showAtmosphere(true)
 .atmosphereColor('#29bfff')
 .atmosphereAltitude(.16)
 .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
 .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png');

const controls=globe.controls();
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.rotateSpeed=.5;
controls.zoomSpeed=.6;
controls.minDistance=160;
controls.maxDistance=430;
controls.autoRotate=false;

let handReady=false;
let lastX=null,lastY=null;
let lastPinch=null;
let smoothX=0,smoothY=0,smoothZoom=0;
let noHandFrames=0;

function setStatus(t){statusEl.textContent=t}

function resizeCanvas(){
 const r=video.getBoundingClientRect();
 canvas.width=Math.max(1,Math.floor(r.width*2));
 canvas.height=Math.max(1,Math.floor(r.height*2));
}
window.addEventListener('resize',resizeCanvas);

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function handIsOpen(lm){
 // Đầu ngón tay nằm cao hơn các khớp tương ứng => bàn tay mở
 return (
   lm[8].y<lm[6].y &&
   lm[12].y<lm[10].y &&
   lm[16].y<lm[14].y &&
   lm[20].y<lm[18].y
 );
}

function onResults(results){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!results.multiHandLandmarks || !results.multiHandLandmarks.length){
   noHandFrames++;
   if(noHandFrames>8){
     handReady=false;
     lastX=lastY=null;
     lastPinch=null;
     setStatus('🖐️ Đưa bàn tay vào khung camera');
   }
   return;
 }
 noHandFrames=0;
 handReady=true;

 const lm=results.multiHandLandmarks[0];

 drawConnectors(ctx,lm,HAND_CONNECTIONS,{color:'#48eaff',lineWidth:3});
 drawLandmarks(ctx,lm,{color:'#ffffff',lineWidth:1,radius:3});

 const index=lm[8];
 const pinch=distance(lm[4],lm[8]);
 const open=handIsOpen(lm);

 // Pinch: khoảng cách ngón cái - trỏ điều khiển zoom
 if(lastPinch!==null){
   const delta=pinch-lastPinch;
   if(Math.abs(delta)>.008){
     const z=controls.getDistance();
     controls.dollyIn(1 + clamp(delta*4,-.18,.18));
     controls.update();
   }
 }
 lastPinch=pinch;

 // Khi mở bàn tay, không xoay để người dùng "giữ" trạng thái
 if(open){
   setStatus('✋ Bàn tay mở — ĐANG GIỮ');
   lastX=index.x; lastY=index.y;
   return;
 }

 // Ngón trỏ điều khiển xoay
 if(lastX!==null){
   const dx=index.x-lastX;
   const dy=index.y-lastY;

   // smoothing để tránh rung
   smoothX=smoothX*.65+dx*.35;
   smoothY=smoothY*.65+dy*.35;

   if(Math.abs(smoothX)>.002 || Math.abs(smoothY)>.002){
     controls.rotateLeft(smoothX*5.0);
     controls.rotateUp(smoothY*3.2);
     controls.update();
     setStatus('☝️ Đang điều khiển Trái Đất');
   }
 }
 lastX=index.x;
 lastY=index.y;
}

const hands=new Hands({
 locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
 maxNumHands:1,
 modelComplexity:0,          // nhẹ hơn, phù hợp máy yếu
 minDetectionConfidence:.62,
 minTrackingConfidence:.58
});
hands.onResults(onResults);

let cam=null;
document.getElementById('start').onclick=async()=>{
 try{
   setStatus('⏳ Đang xin quyền camera...');
   const stream=await navigator.mediaDevices.getUserMedia({
     video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},
     audio:false
   });
   video.srcObject=stream;
   await video.play();
   resizeCanvas();

   if(cam) cam.stop();
   cam=new Camera(video,{
     onFrame:async()=>{await hands.send({image:video})},
     width:640,
     height:480
   });
   cam.start();

   document.getElementById('start').style.display='none';
   setStatus('☝️ Đưa tay vào camera');
 }catch(e){
   console.error(e);
   setStatus('❌ Không mở được camera — hãy cho phép Camera và dùng HTTPS/GitHub Pages');
 }
};

// Cho phép dùng chuột như phương án dự phòng
earthEl.addEventListener('pointerdown',()=>controls.autoRotate=false);
</script>
</body>
</html>'''

path=Path("/mnt/data/earth_hand_control.html")
path.write_text(html,encoding="utf-8")
print(path)

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TANK Hologram Hand Control</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#camera{
    position:fixed;
    right:15px;
    bottom:15px;
    width:160px;
    height:120px;
    object-fit:cover;
    border-radius:15px;
    opacity:.30;
    transform:scaleX(-1);
    border:1px solid #00ffff;
    z-index:5;
}

#ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:10;
    color:#00ffff;
    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff;
    pointer-events:none;
}

#title{
    font-size:24px;
    font-weight:bold;
    letter-spacing:2px;
}

#gesture{
    margin-top:8px;
    font-size:18px;
}

#status{
    margin-top:6px;
    font-size:12px;
    opacity:.75;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;

    padding:18px 30px;

    border:1px solid #00ffff;
    border-radius:15px;

    color:#00ffff;
    background:rgba(0,15,25,.92);

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 15px #00ffff,
        inset 0 0 20px rgba(0,255,255,.15);
}

.hint{
    position:fixed;
    bottom:145px;
    left:50%;
    transform:translateX(-50%);

    color:rgba(0,255,255,.6);
    font-size:12px;
    text-align:center;
    pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<video id="camera"
       autoplay
       muted
       playsinline></video>

<div id="ui">

    <div id="title">
        TANK HOLOGRAM
    </div>

    <div id="gesture">
        Đưa tay trước camera...
    </div>

    <div id="status">
        Chưa kết nối camera
    </div>

</div>

<div class="hint">
    Di chuyển tay • 🤏 Pinch • ✋ Đẩy tay • Xoay cổ tay
</div>

<button id="start">
    🎥 BẬT HOLOGRAM
</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =========================================================
   TANK HOLOGRAM
   Hand-controlled particle system
========================================================= */


/* =========================
   CONFIG
========================= */

const MAX_PARTICLES = 14000;

let particleCount = 12000;

let currentShape = "sphere";

let currentGesture = "";

let handDetected = false;


/* =========================
   UI
========================= */

const gestureUI =
document.getElementById("gesture");

const statusUI =
document.getElementById("status");


/* =========================
   THREE
========================= */

const canvas =
document.getElementById("canvas");

const scene =
new THREE.Scene();


const camera3D =
new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    100
);

camera3D.position.z = 6;


const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    antialias:false,

    powerPreference:
        "high-performance"

});


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);


/* =========================
   PARTICLES
========================= */

const positions =
new Float32Array(
    MAX_PARTICLES * 3
);

const targets =
new Float32Array(
    MAX_PARTICLES * 3
);


for(
    let i=0;
    i<MAX_PARTICLES;
    i++
){

    const j=i*3;

    positions[j] =
        (Math.random()-.5)*4;

    positions[j+1] =
        (Math.random()-.5)*4;

    positions[j+2] =
        (Math.random()-.5)*4;

    targets[j] =
        positions[j];

    targets[j+1] =
        positions[j+1];

    targets[j+2] =
        positions[j+2];

}


const geometry =
new THREE.BufferGeometry();


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


/* =========================
   PARTICLE MATERIAL
========================= */

const material =
new THREE.PointsMaterial({

    color:0x00ffff,

    size:.025,

    transparent:true,

    opacity:.92,

    depthWrite:false,

    blending:
        THREE.AdditiveBlending

});


const particles =
new THREE.Points(
    geometry,
    material
);


scene.add(particles);


/* =========================================================
   SHAPE GENERATORS
========================================================= */


/* ---------- SPHERE ---------- */

function spherePoint(){

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    const radius =
        1.55 *
        Math.cbrt(
            Math.random()
        );

    return {

        x:
        radius *
        Math.sin(phi) *
        Math.cos(theta),

        y:
        radius *
        Math.sin(phi) *
        Math.sin(theta),

        z:
        radius *
        Math.cos(phi)

    };

}


/* ---------- CUBE ---------- */

function cubePoint(){

    const s=1.6;

    const face =
        Math.floor(
            Math.random()*6
        );

    let x =
        (Math.random()-.5)*s*2;

    let y =
        (Math.random()-.5)*s*2;

    let z =
        (Math.random()-.5)*s*2;


    if(face===0) x=s;
    if(face===1) x=-s;

    if(face===2) y=s;
    if(face===3) y=-s;

    if(face===4) z=s;
    if(face===5) z=-s;


    return{x,y,z};

}


/* ---------- EXPLOSION ---------- */

function explosionPoint(){

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    const radius =
        1.2+
        Math.random()*3.2;

    return {

        x:
        radius*
        Math.sin(phi)*
        Math.cos(theta),

        y:
        radius*
        Math.sin(phi)*
        Math.sin(theta),

        z:
        radius*
        Math.cos(phi)

    };

}


/* ---------- HEART ---------- */

function heartPoint(){

    const t =
        Math.random() *
        Math.PI * 2;

    const r =
        Math.sqrt(
            Math.random()
        );

    const x =
        16*Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return {

        x:x*r*.115,

        y:y*r*.115,

        z:
        (Math.random()-.5)*.45

    };

}


/* =========================================================
   VIETNAM FLAG
========================================================= */

function flagPoint(){

    const width=4.2;

    const height=2.5;

    let x =
        (Math.random()-.5)*width;

    let y =
        (Math.random()-.5)*height;

    let z =
        (Math.random()-.5)*.08;


    /*
       Approximate five-point star region
    */

    const dx=x;

    const dy=y;

    const distance =
        Math.sqrt(
            dx*dx+dy*dy
        );


    if(distance<.75){

        const angle =
            Math.atan2(
                dy,
                dx
            );

        const star =
            Math.cos(
                angle*5
            );


        if(star>0.08){

            const r =
                Math.random()*.72;

            x =
                Math.cos(angle)*r;

            y =
                Math.sin(angle)*r;

            z=.12;

        }

    }


    return{x,y,z};

}


/* =========================================================
   TANK TEXT
========================================================= */

function makeTank(){

    const c =
        document.createElement(
            "canvas"
        );

    c.width=800;

    c.height=300;


    const ctx =
        c.getContext("2d");


    ctx.fillStyle="white";

    ctx.font=
        "bold 220px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        "TANK",
        400,
        150
    );


    const data =
        ctx.getImageData(
            0,
            0,
            800,
            300
        ).data;


    const points=[];


    for(
        let y=0;
        y<300;
        y+=5
    ){

        for(
            let x=0;
            x<800;
            x+=5
        ){

            const index =
                (y*800+x)*4;


            if(
                data[index+3]>100
            ){

                points.push({

                    x:
                    (x-400)/85,

                    y:
                    -(y-150)/85,

                    z:
                    (Math.random()-.5)*.25

                });

            }

        }

    }


    return points;

}


const tankPoints =
makeTank();


/* =========================================================
   CHANGE SHAPE
========================================================= */

function changeShape(type){

    if(
        type===currentShape
    ){
        return;
    }


    currentShape=type;


    for(
        let i=0;
        i<particleCount;
        i++
    ){

        let p;


        if(type==="sphere")
            p=spherePoint();

        else if(type==="cube")
            p=cubePoint();

        else if(type==="explode")
            p=explosionPoint();

        else if(type==="heart")
            p=heartPoint();

        else if(type==="flag")
            p=flagPoint();

        else if(type==="tank")
            p=
            tankPoints[
                i%tankPoints.length
            ];


        const j=i*3;


        targets[j]=p.x;

        targets[j+1]=p.y;

        targets[j+2]=p.z;

    }


    if(type==="heart"){

        material.color.setHex(
            0xff1595
        );

    }

    else if(type==="flag"){

        material.color.setHex(
            0xff2222
        );

    }

    else{

        material.color.setHex(
            0x00ffff
        );

    }

}


/* =========================================================
   HAND STATE
========================================================= */

let handX=.5;

let handY=.5;

let handDepth=.5;

let handRotation=0;

let pinch=false;

let indexX=.5;

let indexY=.5;


/* smoothing */

let smoothX=.5;

let smoothY=.5;

let smoothDepth=.5;

let smoothRotation=0;


/* =========================================================
   COUNT FINGERS
========================================================= */

function countFingers(l){

    let count=0;


    /*
       thumb
    */

    const thumbTip=l[4];

    const thumbIP=l[3];


    if(
        Math.abs(
            thumbTip.x-l[17].x
        ) >
        Math.abs(
            thumbIP.x-l[17].x
        )
    ){

        count++;

    }


    /*
       other fingers
    */

    const tips=[
        8,12,16,20
    ];

    const joints=[
        6,10,14,18
    ];


    for(
        let i=0;
        i<4;
        i++
    ){

        if(
            l[tips[i]].y <
            l[joints[i]].y
        ){

            count++;

        }

    }


    return count;

}


/* =========================================================
   PINCH DETECTION
========================================================= */

function isPinching(l){

    const dx =
        l[4].x-l[8].x;

    const dy =
        l[4].y-l[8].y;


    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    return distance<.075;

}


/* =========================================================
   HAND ROTATION
========================================================= */

function getHandRotation(l){

    const dx =
        l[17].x-l[5].x;

    const dy =
        l[17].y-l[5].y;


    return Math.atan2(
        dy,
        dx
    );

}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
new Hands({

    locateFile:
    file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

    maxNumHands:1,

    modelComplexity:0,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65

});


hands.onResults(
results=>{

    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0
    ){

        handDetected=false;

        statusUI.innerText=
            "Đang tìm bàn tay...";

        return;

    }


    handDetected=true;


    const l =
        results.multiHandLandmarks[0];


    /* =========================
       POSITION
    ========================= */

    handX=l[9].x;

    handY=l[9].y;


    /*
       depth approximation
       distance wrist -> middle MCP
    */

    const dx =
        l[5].x-l[17].x;

    const dy =
        l[5].y-l[17].y;


    const palmSize =
        Math.sqrt(
            dx*dx+dy*dy
        );


    handDepth =
        THREE.MathUtils.clamp(
            palmSize,
            .10,
            .35
        );


    /* =========================
       ROTATION
    ========================= */

    handRotation =
        getHandRotation(l);


    /* =========================
       INDEX
    ========================= */

    indexX=l[8].x;

    indexY=l[8].y;


    /* =========================
       PINCH
    ========================= */

    pinch=
        isPinching(l);


    /* =========================
       GESTURE
    ========================= */

    const fingers =
        countFingers(l);


    let type="";

    let label="";


    if(fingers===0){

        type="tank";

        label="✊ TANK";

    }

    else if(fingers===1){

        type="explode";

        label="☝️ HẠT NỞ";

    }

    else if(fingers===2){

        type="cube";

        label="✌️ HÌNH VUÔNG";

    }

    else if(fingers===3){

        type="sphere";

        label="🤟 HÌNH CẦU";

    }

    else if(fingers===4){

        type="heart";

        label="🖖 TRÁI TIM";

    }

    else if(fingers===5){

        type="flag";

        label="🖐️ VIỆT NAM 🇻🇳";

    }


    gestureUI.innerText=
        label+
        (
            pinch
            ?"  •  🤏 PINCH"
            :""
        );


    if(type!==currentGesture){

        currentGesture=type;

        changeShape(type);

    }


    statusUI.innerText=
        "Bàn tay đã khóa • Điều khiển trực tiếp";

});


/* =========================================================
   PARTICLE ANIMATION
========================================================= */

let lastTime=
performance.now();

let fps=60;


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    const dt=
        Math.min(
            now-lastTime,
            50
        );


    lastTime=now;


    fps=
        fps*.95+
        (1000/Math.max(dt,1))*.05;


    /*
       =========================
       SMOOTH HAND POSITION
       =========================
    */

    smoothX +=
        (handX-smoothX)*.10;

    smoothY +=
        (handY-smoothY)*.10;

    smoothDepth +=
        (handDepth-smoothDepth)*.08;

    smoothRotation +=
        (handRotation-smoothRotation)*.08;


    /*
       =========================
       MOVE HOLOGRAM
       =========================
    */


    /*
       camera coordinates:
       x = left/right
       y = up/down
    */

    const targetX =
        (0.5-smoothX)*5;

    const targetY =
        (0.5-smoothY)*3;


    particles.position.x +=
        (targetX-
         particles.position.x)*.08;

    particles.position.y +=
        (targetY-
         particles.position.y)*.08;


    /*
       =========================
       DEPTH / ZOOM
       =========================
    */


    const zoom =
        THREE.MathUtils.clamp(
            smoothDepth*5.2,
            .65,
            1.8
        );


    particles.scale.x +=
        (zoom-
         particles.scale.x)*.07;

    particles.scale.y =
        particles.scale.x;

    particles.scale.z =
        particles.scale.x;


    /*
       =========================
       ROTATE WITH WRIST
       =========================
    */

    particles.rotation.z +=
        (
            smoothRotation-
            particles.rotation.z
        )*.08;


    /*
       =========================
       PARTICLES
       =========================
    */

    const pos =
        geometry
        .attributes
        .position
        .array;


    for(
        let i=0;
        i<particleCount;
        i++
    ){

        const j=i*3;


        /*
           normal attraction
        */

        pos[j] +=
            (
                targets[j]-
                pos[j]
            )*.055;

        pos[j+1] +=
            (
                targets[j+1]-
                pos[j+1]
            )*.055;

        pos[j+2] +=
            (
                targets[j+2]-
                pos[j+2]
            )*.055;


        /*
           hologram floating
        */

        pos[j+1] +=
            Math.sin(
                now*.001+
                i*.013
            )*.0007;


        /*
           PINCH
           hút hạt vào ngón tay
        */

        if(pinch){

            const tx =
                (indexX-.5)*5;

            const ty =
                -(indexY-.5)*3;


            const dx =
                tx-pos[j];

            const dy =
                ty-pos[j+1];


            pos[j] +=
                dx*.012;

            pos[j+1] +=
                dy*.012;

        }

    }


    geometry
    .attributes
    .position
    .needsUpdate=true;


    /*
       =========================
       HẠT THEO NGÓN TRỎ
       =========================
    */

    if(
        handDetected &&
        currentGesture==="explode"
    ){

        const tx =
            (indexX-.5)*5;

        const ty =
            -(indexY-.5)*3;


        /*
           chỉ tác động một phần
           để tạo "đuôi năng lượng"
        */

        for(
            let i=0;
            i<Math.min(
                particleCount,
                2500
            );
            i+=2
        ){

            const j=i*3;

            pos[j] +=
                (
                    tx-pos[j]
                )*.006;

            pos[j+1] +=
                (
                    ty-pos[j+1]
                )*.006;

        }

    }


    /*
       =========================
       FPS AUTO OPTIMIZATION
       =========================
    */

    if(
        fps<30 &&
        particleCount>6000
    ){

        particleCount-=500;

    }


    if(
        fps>52 &&
        particleCount<12000
    ){

        particleCount+=250;

    }


    /*
       =========================
       RENDER
       =========================
    */

    renderer.render(
        scene,
        camera3D
    );

}


/* =========================================================
   START ANIMATION
========================================================= */

changeShape("sphere");

animate();


/* =========================================================
   CAMERA
========================================================= */

const video =
document.getElementById(
    "camera"
);


document
.getElementById("start")
.addEventListener(
"click",
async()=>{

    try{

        statusUI.innerText=
            "Đang mở camera...";


        const stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                },

                frameRate:{
                    ideal:24,
                    max:30
                }

            },

            audio:false

        });


        video.srcObject=
            stream;


        const cam =
        new Camera(
            video,
            {

                onFrame:
                async()=>{

                    await hands.send({
                        image:video
                    });

                },

                width:640,

                height:480

            }
        );


        cam.start();


        document
        .getElementById("start")
        .style.display="none";


        statusUI.innerText=
            "Camera đã bật • Đưa tay vào khung";


    }

    catch(error){

        console.error(error);


        alert(
            "Không mở được camera.\n\n"+
            "Hãy cho phép trình duyệt sử dụng camera "+
            "và đảm bảo trang web chạy bằng HTTPS."
        );


        statusUI.innerText=
            "Không thể mở camera";

    }

});


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

    camera3D.aspect=
        innerWidth/
        innerHeight;


    camera3D.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>TANK Hologram</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#camera{
    position:fixed;
    right:15px;
    bottom:15px;
    width:150px;
    height:110px;
    object-fit:cover;
    border-radius:14px;
    opacity:.32;
    transform:scaleX(-1);
    border:1px solid #00ffff;
    z-index:5;
}

#ui{
    position:fixed;
    top:18px;
    left:18px;
    z-index:10;
    color:#00ffff;
    text-shadow:
        0 0 5px #00ffff,
        0 0 15px #00ffff;
    pointer-events:none;
}

#title{
    font-size:24px;
    font-weight:bold;
    letter-spacing:2px;
}

#gesture{
    margin-top:8px;
    font-size:18px;
}

#fps{
    margin-top:5px;
    font-size:12px;
    opacity:.7;
}

#start{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;

    padding:18px 30px;

    border:1px solid #00ffff;
    border-radius:15px;

    color:#00ffff;
    background:rgba(0,15,25,.9);

    font-size:18px;
    font-weight:bold;

    box-shadow:
        0 0 12px #00ffff,
        inset 0 0 15px rgba(0,255,255,.15);
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<video id="camera"
       autoplay
       muted
       playsinline></video>

<div id="ui">

    <div id="title">
        TANK HOLOGRAM
    </div>

    <div id="gesture">
        Đưa tay trước camera...
    </div>

    <div id="fps">
        FPS: --
    </div>

</div>

<button id="start">
    🎥 BẬT CAMERA
</button>


<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =====================================================
   CẤU HÌNH HIỆU NĂNG
===================================================== */

const MAX_PARTICLES = 12000;

let PARTICLES = MAX_PARTICLES;

let currentShape = "sphere";

let lastGesture = "";

let lastChange = 0;


/* =====================================================
   THREE.JS
===================================================== */

const canvas =
document.getElementById("canvas");

const scene =
new THREE.Scene();

const camera3D =
new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    100
);

camera3D.position.z = 6;


const renderer =
new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:false,
    alpha:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);


/* =====================================================
   HẠT
===================================================== */

const positions =
new Float32Array(MAX_PARTICLES * 3);

const targets =
new Float32Array(MAX_PARTICLES * 3);

const velocities =
new Float32Array(MAX_PARTICLES * 3);


/* tạo vị trí ban đầu */

for(let i=0;i<MAX_PARTICLES;i++){

    const j=i*3;

    positions[j] =
        (Math.random()-.5)*5;

    positions[j+1] =
        (Math.random()-.5)*5;

    positions[j+2] =
        (Math.random()-.5)*5;

    targets[j] =
        positions[j];

    targets[j+1] =
        positions[j+1];

    targets[j+2] =
        positions[j+2];
}


const geometry =
new THREE.BufferGeometry();


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


/* =====================================================
   MATERIAL
===================================================== */

const material =
new THREE.PointsMaterial({

    color:0x00ffff,

    size:.026,

    transparent:true,

    opacity:.9,

    depthWrite:false,

    blending:
        THREE.AdditiveBlending

});


const particleSystem =
new THREE.Points(
    geometry,
    material
);


scene.add(
    particleSystem
);


/* =====================================================
   HÌNH CẦU
===================================================== */

function spherePoint(){

    const u =
        Math.random();

    const v =
        Math.random();

    const theta =
        2*Math.PI*u;

    const phi =
        Math.acos(
            2*v-1
        );

    const radius =
        1.65 *
        Math.cbrt(
            Math.random()
        );

    return {

        x:
        radius*
        Math.sin(phi)*
        Math.cos(theta),

        y:
        radius*
        Math.sin(phi)*
        Math.sin(theta),

        z:
        radius*
        Math.cos(phi)

    };
}


/* =====================================================
   HÌNH VUÔNG 3D
===================================================== */

function cubePoint(){

    const s=1.7;

    let x,y,z;

    const face =
        Math.floor(
            Math.random()*6
        );

    x =
        (Math.random()-.5)*s*2;

    y =
        (Math.random()-.5)*s*2;

    z =
        (Math.random()-.5)*s*2;

    if(face===0)x=s;
    if(face===1)x=-s;

    if(face===2)y=s;
    if(face===3)y=-s;

    if(face===4)z=s;
    if(face===5)z=-s;

    return{x,y,z};
}


/* =====================================================
   NỞ RA
===================================================== */

function explosionPoint(){

    const theta =
        Math.random()*
        Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    const radius =
        1.2+
        Math.random()*3;

    return{

        x:
        radius*
        Math.sin(phi)*
        Math.cos(theta),

        y:
        radius*
        Math.sin(phi)*
        Math.sin(theta),

        z:
        radius*
        Math.cos(phi)

    };
}


/* =====================================================
   TRÁI TIM
===================================================== */

function heartPoint(){

    const t =
        Math.random()*
        Math.PI*2;

    const r =
        Math.sqrt(
            Math.random()
        );

    const x =
        16*Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    return{

        x:x*r*.115,

        y:y*r*.115,

        z:
        (Math.random()-.5)*.45

    };
}


/* =====================================================
   LÁ CỜ VIỆT NAM
===================================================== */

function flagPoint(){

    const width=4.2;

    const height=2.5;

    let x =
        (Math.random()-.5)*
        width;

    let y =
        (Math.random()-.5)*
        height;

    let z =
        (Math.random()-.5)*.08;


    /*
       tạo vùng ngôi sao
    */

    const dx=x;

    const dy=y;

    const distance =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(distance < .72){

        const angle =
            Math.atan2(
                dy,
                dx
            );

        /*
           5 cánh đơn giản
        */

        const wave =
            Math.cos(
                angle*5
            );

        if(wave>.05){

            const r =
                .75*
                Math.random();

            x =
                Math.cos(angle)*r;

            y =
                Math.sin(angle)*r;

            z=.12;

            return{
                x,y,z
            };
        }

    }

    return{
        x,y,z
    };
}


/* =====================================================
   TẠO CHỮ TANK
===================================================== */

function makeTankPoints(){

    const c =
        document.createElement(
            "canvas"
        );

    c.width=800;

    c.height=300;

    const ctx =
        c.getContext("2d");

    ctx.fillStyle="#fff";

    ctx.font=
        "bold 220px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        "TANK",
        400,
        150
    );


    const image =
        ctx.getImageData(
            0,
            0,
            c.width,
            c.height
        ).data;


    const points=[];


    for(
        let y=0;
        y<c.height;
        y+=5
    ){

        for(
            let x=0;
            x<c.width;
            x+=5
        ){

            const index =
                (y*c.width+x)*4;


            if(
                image[index+3]>100
            ){

                points.push({

                    x:
                    (x-400)/85,

                    y:
                    -(y-150)/85,

                    z:
                    (Math.random()-.5)*.3

                });

            }

        }

    }

    return points;
}


const tankPoints =
makeTankPoints();


/* =====================================================
   ĐỔI HÌNH
===================================================== */

function changeShape(type){

    if(
        type===currentShape
    )return;


    currentShape=type;


    for(
        let i=0;
        i<PARTICLES;
        i++
    ){

        let p;

        if(type==="explode")
            p=explosionPoint();

        else if(type==="cube")
            p=cubePoint();

        else if(type==="sphere")
            p=spherePoint();

        else if(type==="heart")
            p=heartPoint();

        else if(type==="flag")
            p=flagPoint();

        else if(type==="tank")
            p=
            tankPoints[
                i%tankPoints.length
            ];


        const j=i*3;


        targets[j]=p.x;

        targets[j+1]=p.y;

        targets[j+2]=p.z;


        /*
           tạo lực chuyển động
        */

        velocities[j] =
            (Math.random()-.5)*.05;

        velocities[j+1] =
            (Math.random()-.5)*.05;

        velocities[j+2] =
            (Math.random()-.5)*.05;

    }


    /* màu */

    if(type==="heart"){

        material.color.setHex(
            0xff1493
        );

    }

    else if(type==="flag"){

        material.color.setHex(
            0xff2222
        );

    }

    else{

        material.color.setHex(
            0x00ffff
        );

    }

}


/* =====================================================
   ANIMATION
===================================================== */

let lastFrame =
performance.now();

let fps=60;

function animate(){

    requestAnimationFrame(
        animate
    );


    const now =
        performance.now();


    /*
       FPS
    */

    const delta =
        now-lastFrame;

    lastFrame=now;


    if(delta>0){

        fps =
            fps*.95+
            (1000/delta)*.05;

    }


    document.getElementById(
        "fps"
    ).innerText =
        "FPS: "+
        Math.round(fps)+
        " | HẠT: "+
        PARTICLES;


    /*
       nếu FPS thấp
       tự giảm hạt
    */

    if(
        fps<30 &&
        PARTICLES>6000
    ){

        PARTICLES=
            Math.max(
                6000,
                PARTICLES-1000
            );

    }


    /*
       cập nhật hạt
    */

    const pos =
        geometry.attributes
        .position.array;


    for(
        let i=0;
        i<PARTICLES;
        i++
    ){

        const j=i*3;


        /*
           chuyển động mượt
        */

        pos[j] +=
            (targets[j]-
             pos[j])*.065;


        pos[j+1] +=
            (targets[j+1]-
             pos[j+1])*.065;


        pos[j+2] +=
            (targets[j+2]-
             pos[j+2])*.065;


        /*
           chuyển động hologram nhẹ
        */

        pos[j+1] +=
            Math.sin(
                now*.001+
                i*.01
            )*.0008;

    }


    geometry.attributes
        .position
        .needsUpdate=true;


    /*
       xoay rất nhẹ
    */

    particleSystem.rotation.y +=
        .0007;


    renderer.render(
        scene,
        camera3D
    );

}


animate();


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

const video =
document.getElementById(
    "camera"
);

const gestureText =
document.getElementById(
    "gesture"
);


const hands =
new Hands({

    locateFile:
    file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});


hands.setOptions({

    maxNumHands:1,

    modelComplexity:0,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65

});


/* =====================================================
   ĐẾM NGÓN
===================================================== */

function countFingers(l){

    let count=0;


    /*
       ngón cái
    */

    if(
        Math.abs(
            l[4].x-l[17].x
        ) >
        Math.abs(
            l[3].x-l[17].x
        )
    ){

        count++;

    }


    /*
       4 ngón còn lại
    */

    const tips=[
        8,12,16,20
    ];

    const joints=[
        6,10,14,18
    ];


    for(
        let i=0;
        i<4;
        i++
    ){

        if(
            l[tips[i]].y <
            l[joints[i]].y
        ){

            count++;

        }

    }


    return count;
}


/* =====================================================
   NHẬN DIỆN
===================================================== */

hands.onResults(
results=>{

    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0
    ){

        gestureText.innerText=
            "Đưa tay trước camera...";

        return;

    }


    const landmarks =
        results.multiHandLandmarks[0];


    const fingers =
        countFingers(
            landmarks
        );


    let gesture="";


    if(fingers===0){

        gesture="✊ TANK";

        if(lastGesture!=="tank")
            changeShape("tank");

        lastGesture="tank";

    }

    else if(fingers===1){

        gesture="☝️ HẠT NỞ";

        if(lastGesture!=="explode")
            changeShape("explode");

        lastGesture="explode";

    }

    else if(fingers===2){

        gesture="✌️ HÌNH VUÔNG";

        if(lastGesture!=="cube")
            changeShape("cube");

        lastGesture="cube";

    }

    else if(fingers===3){

        gesture="🤟 HÌNH CẦU";

        if(lastGesture!=="sphere")
            changeShape("sphere");

        lastGesture="sphere";

    }

    else if(fingers===4){

        gesture="🖖 TRÁI TIM";

        if(lastGesture!=="heart")
            changeShape("heart");

        lastGesture="heart";

    }

    else if(fingers===5){

        gesture="🖐️ VIỆT NAM 🇻🇳";

        if(lastGesture!=="flag")
            changeShape("flag");

        lastGesture="flag";

    }


    gestureText.innerText=
        gesture;

});


/* =====================================================
   CAMERA
===================================================== */

document
.getElementById("start")
.addEventListener(
"click",
async()=>{

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:{
                facingMode:"user",

                width:{
                    ideal:640
                },

                height:{
                    ideal:480
                },

                frameRate:{
                    ideal:24,
                    max:30
                }

            },

            audio:false

        });


        video.srcObject=
            stream;


        const cam =
        new Camera(
            video,
            {

                onFrame:
                async()=>{

                    await hands.send({
                        image:video
                    });

                },

                width:640,

                height:480

            }
        );


        cam.start();


        document
        .getElementById("start")
        .style.display="none";


    }catch(error){

        alert(
            "Không thể mở camera.\n\n"+
            "Hãy cho phép trình duyệt sử dụng camera "+
            "và đảm bảo website chạy bằng HTTPS."
        );

        console.error(error);

    }

});


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
"resize",
()=>{

    camera3D.aspect =
        innerWidth/
        innerHeight;

    camera3D.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});

</script>

</body>
</html>

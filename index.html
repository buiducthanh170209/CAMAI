<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hiệu ứng cử chỉ tay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    video {
      transform: scaleX(-1);
    }
    #effectCanvas {
      z-index: 5;
      transform: scaleX(-1);
      pointer-events: none;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 20;
    }
    .btn {
      background: rgba(0,0,0,0.65);
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    #status {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      z-index: 20;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="effectCanvas"></canvas>

    <div id="ui">
      <button class="btn" onclick="clearEffects()">Xóa hiệu ứng</button>
    </div>
    <div id="status">Đưa tay vào khung hình</div>
  </div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("effectCanvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    let particles = [];
    let hearts = [];
    let fireworks = [];
    let glowIntensity = 0;
    let specialTime = 0;

    // ====================== PARTICLE ======================
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6 - 2;
        this.life = 1;
        this.decay = 0.015 + Math.random() * 0.02;
        this.size = 3 + Math.random() * 5;
        this.color = color || `hsl(${Math.random()*60 + 30}, 100%, 60%)`;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // ====================== HEART ======================
    class Heart {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vy = -2 - Math.random() * 2;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.life = 1;
        this.size = 12 + Math.random() * 16;
        this.rot = Math.random() * Math.PI;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.008;
        this.rot += 0.05;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.globalAlpha = this.life;
        ctx.fillStyle = "#ff2d55";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size/2, -this.size/2, -this.size, this.size/3, 0, this.size);
        ctx.bezierCurveTo(this.size, this.size/3, this.size/2, -this.size/2, 0, 0);
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    // ====================== FIREWORK ======================
    class Firework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.particles = [];
        for (let i = 0; i < 30; i++) {
          const angle = (Math.PI * 2 * i) / 30;
          const speed = 2 + Math.random() * 4;
          this.particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: `hsl(${Math.random()*360}, 100%, 60%)`
          });
        }
      }
      update() {
        this.particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05;
          p.life -= 0.02;
        });
      }
      draw(ctx) {
        this.particles.forEach(p => {
          if (p.life > 0) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        ctx.globalAlpha = 1;
      }
      get alive() {
        return this.particles.some(p => p.life > 0);
      }
    }

    // ====================== ĐẾM SỐ NGÓN ======================
    function countFingers(landmarks) {
      const tips = [8, 12, 16, 20]; // trỏ, giữa, áp út, út
      const pips = [6, 10, 14, 18];
      let count = 0;

      // Ngón cái
      if (landmarks[4].x < landmarks[3].x) count++; // tay phải (đã lật)

      for (let i = 0; i < 4; i++) {
        if (landmarks[tips[i]].y < landmarks[pips[i]].y) count++;
      }
      return count;
    }

    function clearEffects() {
      particles = [];
      hearts = [];
      fireworks = [];
      glowIntensity = 0;
      specialTime = 0;
    }

    // ====================== XỬ LÝ KẾT QUẢ ======================
    function onResults(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        statusEl.textContent = "Đưa tay vào khung hình";
        // Vẫn cập nhật particle đang bay
        updateAndDraw();
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const fingers = countFingers(landmarks);
      const tip = landmarks[8]; // ngón trỏ
      const x = tip.x * canvas.width;
      const y = tip.y * canvas.height;

      statusEl.textContent = `Đang dùng: ${fingers} ngón`;

      // ===== 1 NGÓN: Hạt bay =====
      if (fingers === 1) {
        for (let i = 0; i < 3; i++) {
          particles.push(new Particle(x, y));
        }
      }

      // ===== 2 NGÓN: Trái tim =====
      if (fingers === 2 && Math.random() < 0.3) {
        hearts.push(new Heart(x, y));
      }

      // ===== 3 NGÓN: Pháo hoa =====
      if (fingers === 3 && Math.random() < 0.08) {
        fireworks.push(new Firework(x, y));
      }

      // ===== 4 NGÓN: Glow =====
      if (fingers === 4) {
        glowIntensity = Math.min(1, glowIntensity + 0.05);
      } else {
        glowIntensity = Math.max(0, glowIntensity - 0.02);
      }

      // ===== 5 NGÓN: Hiệu ứng đặc biệt =====
      if (fingers === 5) {
        specialTime = 60;
        for (let i = 0; i < 8; i++) {
          particles.push(new Particle(
            x + (Math.random()-0.5)*80,
            y + (Math.random()-0.5)*80,
            `hsl(${Math.random()*360}, 100%, 70%)`
          ));
        }
      }

      updateAndDraw(x, y);
    }

    function updateAndDraw(cx = 0, cy = 0) {
      // Particle
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw(ctx);
      });

      // Hearts
      hearts = hearts.filter(h => h.life > 0);
      hearts.forEach(h => {
        h.update();
        h.draw(ctx);
      });

      // Fireworks
      fireworks = fireworks.filter(f => f.alive);
      fireworks.forEach(f => {
        f.update();
        f.draw(ctx);
      });

      // Glow (4 ngón)
      if (glowIntensity > 0) {
        const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 180);
        gradient.addColorStop(0, `rgba(0, 200, 255, ${0.35 * glowIntensity})`);
        gradient.addColorStop(1, "transparent");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Special (5 ngón)
      if (specialTime > 0) {
        specialTime--;
        ctx.beginPath();
        ctx.arc(cx, cy, 40 + (60 - specialTime), 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${specialTime * 6}, 100%, 60%, ${specialTime / 60})`;
        ctx.lineWidth = 4;
        ctx.stroke();
      }
    }

    // ====================== KHỞI ĐỘNG ======================
    async function start() {
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.75,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        width: 1280,
        height: 720
      });

      await camera.start();
    }

    start().catch(err => {
      console.error(err);
      statusEl.textContent = "Không mở được camera!";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bàn phím ảo - Gõ bằng tay qua Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a1a, #001a2e);
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00f0ff, #ff00aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      margin-bottom: 16px;
      padding: 8px 20px;
      background: rgba(0,240,255,0.1);
      border: 1px solid #00f0ff55;
      border-radius: 30px;
      font-size: 14px;
      color: #00f0ff;
    }

    /* Ô gõ chữ */
    #text-area {
      width: 90%;
      max-width: 900px;
      min-height: 140px;
      background: rgba(0, 20, 40, 0.8);
      border: 2px solid #00f0ff66;
      border-radius: 16px;
      padding: 20px;
      font-size: 24px;
      line-height: 1.5;
      color: #e0f7ff;
      margin-bottom: 25px;
      resize: none;
      outline: none;
      box-shadow: 0 0 30px #00f0ff22;
    }

    /* Bàn phím */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 95%;
      max-width: 980px;
      user-select: none;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .key {
      background: linear-gradient(145deg, #0d2137, #081828);
      border: 1px solid #00f0ff44;
      border-radius: 10px;
      color: #c0f0ff;
      font-size: 18px;
      font-weight: 500;
      min-width: 52px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: 0 4px 0 #003344;
      position: relative;
    }

    .key:hover, .key.hover {
      background: linear-gradient(145deg, #00c4d4, #0088aa);
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 7px 0 #005566;
    }

    .key.active {
      background: linear-gradient(145deg, #00f0ff, #00aaff);
      color: #000;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #005566;
    }

    .key.wide { min-width: 90px; }
    .key.space { min-width: 320px; }
    .key.shift { min-width: 100px; }
    .key.enter { min-width: 100px; }
    .key.backspace { min-width: 90px; }

    /* Camera */
    #webcam {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 220px;
      height: 165px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      transform: scaleX(-1);
      background: #000;
      z-index: 100;
      box-shadow: 0 0 20px #00f0ff55;
    }

    /* Con trỏ tay */
    #cursor {
      position: fixed;
      width: 28px;
      height: 28px;
      border: 3px solid #00f0ff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 200;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #00f0ff, inset 0 0 8px #00f0ff;
      transition: transform 0.05s linear;
      display: none;
    }
    #cursor.pinch {
      background: #00f0ff88;
      transform: translate(-50%, -50%) scale(0.7);
    }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0,15,30,0.9);
      border: 1px solid #00f0ff44;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: #8af4ff;
      max-width: 260px;
      z-index: 50;
    }
  </style>
</head>
<body>
  <h1>Bàn phím ảo - Gõ bằng tay</h1>
  <div id="status">Đang khởi động camera...</div>

  <textarea id="text-area" placeholder="Chữ bạn gõ sẽ hiện ở đây..."></textarea>

  <div id="keyboard"></div>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="cursor"></div>

  <div class="hint">
    <b>Hướng dẫn:</b><br>
    • Di chuyển ngón trỏ = di chuyển con trỏ<br>
    • Chụm ngón cái + ngón trỏ = nhấn phím<br>
    • Giữ Shift để gõ chữ hoa<br>
    • Backspace để xóa
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ====================== BÀN PHÍM ======================
    const layout = [
      ['1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']'],
      ['a','s','d','f','g','h','j','k','l',';',"'",'Enter'],
      ['Shift','z','x','c','v','b','n','m',',','.','/','Backspace'],
      ['Space']
    ];

    const keyboardEl = document.getElementById('keyboard');
    const textArea = document.getElementById('text-area');
    let isShift = false;
    let lastKeyTime = 0;

    // Tạo bàn phím
    layout.forEach(row => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row';
      row.forEach(key => {
        const keyEl = document.createElement('div');
        keyEl.className = 'key';
        keyEl.dataset.key = key;

        if (key === 'Space') keyEl.classList.add('space');
        if (key === 'Shift') keyEl.classList.add('shift');
        if (key === 'Enter') keyEl.classList.add('enter');
        if (key === 'Backspace') keyEl.classList.add('backspace');
        if (['Space','Shift','Enter','Backspace'].includes(key)) keyEl.classList.add('wide');

        keyEl.textContent = key === 'Space' ? '␣ Space' : key;
        rowDiv.appendChild(keyEl);
      });
      keyboardEl.appendChild(rowDiv);
    });

    // ====================== LOGIC GÕ ======================
    function pressKey(key) {
      const now = Date.now();
      if (now - lastKeyTime < 280) return; // chống spam
      lastKeyTime = now;

      const keyEl = document.querySelector(`.key[data-key="${key}"]`);
      if (keyEl) {
        keyEl.classList.add('active');
        setTimeout(() => keyEl.classList.remove('active'), 150);
      }

      if (key === 'Backspace') {
        textArea.value = textArea.value.slice(0, -1);
      } else if (key === 'Enter') {
        textArea.value += '\n';
      } else if (key === 'Space') {
        textArea.value += ' ';
      } else if (key === 'Shift') {
        isShift = !isShift;
        updateShiftUI();
      } else {
        let char = key;
        if (isShift) {
          char = char.toUpperCase();
          // Tự tắt shift sau khi gõ 1 ký tự (giống caps lock tạm)
          isShift = false;
          updateShiftUI();
        }
        textArea.value += char;
      }
      textArea.focus();
      textArea.scrollTop = textArea.scrollHeight;
    }

    function updateShiftUI() {
      const shiftKeys = document.querySelectorAll('.key[data-key="Shift"]');
      shiftKeys.forEach(k => {
        k.style.background = isShift ? 'linear-gradient(145deg, #00f0ff, #00aaff)' : '';
        k.style.color = isShift ? '#000' : '';
      });
    }

    // ====================== HAND TRACKING ======================
    const video = document.getElementById('webcam');
    const cursor = document.getElementById('cursor');
    const status = document.getElementById('status');
    let isPinching = false;
    let lastPinch = false;

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        cursor.style.display = 'none';
        status.textContent = 'Không thấy tay – Đưa tay vào khung hình';
        // Xóa hover
        document.querySelectorAll('.key.hover').forEach(k => k.classList.remove('hover'));
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const indexTip = landmarks[8];
      const thumbTip = landmarks[4];

      // Tọa độ màn hình (đã lật gương)
      const x = (1 - indexTip.x) * window.innerWidth;
      const y = indexTip.y * window.innerHeight;

      cursor.style.display = 'block';
      cursor.style.left = x + 'px';
      cursor.style.top = y + 'px';

      // Kiểm tra pinch
      const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      isPinching = dist < 0.05;

      if (isPinching) {
        cursor.classList.add('pinch');
      } else {
        cursor.classList.remove('pinch');
      }

      // Tìm phím đang hover
      let hoveredKey = null;
      document.querySelectorAll('.key').forEach(keyEl => {
        const rect = keyEl.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          keyEl.classList.add('hover');
          hoveredKey = keyEl.dataset.key;
        } else {
          keyEl.classList.remove('hover');
        }
      });

      // Nhấn phím khi vừa chụm
      if (isPinching && !lastPinch && hoveredKey) {
        pressKey(hoveredKey);
      }
      lastPinch = isPinching;

      status.textContent = isPinching ? 'Đang nhấn phím...' : 'Di chuyển ngón trỏ để chọn phím';
    });

    // Camera
    const camera = new Camera(video, {
      onFrame: async () => await hands.send({ image: video }),
      width: 640,
      height: 480
    });

    camera.start()
      .then(() => status.textContent = 'Camera sẵn sàng – Đưa tay vào khung hình')
      .catch(() => {
        status.innerHTML = '<span style="color:#ff5555">Lỗi camera!</span> Hãy chạy bằng Live Server hoặc python -m http.server';
      });
  </script>
</body>
</html>

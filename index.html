<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phát hiện vật thể chuyển động</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    #app { position: relative; width: 100%; height: 100%; }
    video, canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    video { transform: scaleX(-1); }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #status {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
      padding: 12px 24px; border-radius: 40px; font-size: 15px; font-weight: 500;
      z-index: 20; white-space: nowrap;
    }
    #status.moving {
      background: rgba(220, 38, 38, 0.9);
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.5);
    }
    #footer {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 8px 18px; border-radius: 20px;
      font-size: 13px; color: #ccc; z-index: 20;
    }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(220, 38, 38, 0.95); padding: 20px 24px; border-radius: 16px;
      text-align: center; max-width: 85%; z-index: 30; display: none; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <canvas id="overlay"></canvas>
    <div id="status">Đang khởi động camera...</div>
    <div id="footer">Đưa vật thể chuyển động vào khung hình</div>
    <div id="error"></div>
  </div>

  <script>
    const CONFIG = {
      threshold: 35,
      minArea: 1200,
      sampleStep: 5,
      boxColor: "#ff2d55",
      boxLineWidth: 4
    };

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("overlay");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const overlayCtx = overlay.getContext("2d");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");

    let previousFrame = null;

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Trình duyệt không hỗ trợ camera");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
          statusEl.textContent = "Sẵn sàng - Đưa vật thể vào khung hình";
          detectMotion();
        };
      } catch (err) {
        console.error(err);
        let msg = "Không thể mở camera.<br><br>";

        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
          msg += "Bạn đã từ chối quyền camera.<br>Hãy vào cài đặt trình duyệt và cho phép camera.";
        } else if (err.name === "NotFoundError") {
          msg += "Không tìm thấy camera trên thiết bị.";
        } else if (err.name === "NotReadableError") {
          msg += "Camera đang được ứng dụng khác sử dụng.";
        } else if (err.name === "SecurityError") {
          msg += "Trang web phải chạy trên HTTPS.";
        } else {
          msg += "Lỗi: " + (err.message || err.name);
        }

        showError(msg);
      }
    }

    function detectMotion() {
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      ctx.restore();

      const { width, height } = canvas;
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      overlayCtx.clearRect(0, 0, width, height);

      if (previousFrame) {
        let movingPixels = 0;
        let minX = width, minY = height, maxX = 0, maxY = 0;

        for (let y = 0; y < height; y += CONFIG.sampleStep) {
          for (let x = 0; x < width; x += CONFIG.sampleStep) {
            const i = (y * width + x) * 4;
            const diff =
              Math.abs(data[i] - previousFrame[i]) +
              Math.abs(data[i + 1] - previousFrame[i + 1]) +
              Math.abs(data[i + 2] - previousFrame[i + 2]);

            if (diff > CONFIG.threshold) {
              movingPixels++;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        const area = movingPixels * CONFIG.sampleStep * CONFIG.sampleStep;

        if (area > CONFIG.minArea) {
          statusEl.textContent = "Phát hiện chuyển động!";
          statusEl.classList.add("moving");
          overlayCtx.strokeStyle = CONFIG.boxColor;
          overlayCtx.lineWidth = CONFIG.boxLineWidth;
          overlayCtx.strokeRect(minX, minY, maxX - minX, maxY - minY);
        } else {
          statusEl.textContent = "Không có chuyển động";
          statusEl.classList.remove("moving");
        }
      }

      previousFrame = new Uint8ClampedArray(data);
      requestAnimationFrame(detectMotion);
    }

    function showError(message) {
      errorEl.innerHTML = message;
      errorEl.style.display = "block";
      statusEl.style.display = "none";
    }

    startCamera();
  </script>
</body>
</html>
